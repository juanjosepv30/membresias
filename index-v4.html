<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Center · Membresías</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --plum:      #4A1A6B;
  --plum-mid:  #6B2FA0;
  --plum-lt:   #9B59D0;
  --lavender:  #C9A8E8;
  --cream:     #FAF7FF;
  --white:     #FFFFFF;
  --ink:       #1A0A2E;
  --muted:     #7A6B8A;
  --border:    #E8DEFA;
  --gold:      #E8A020;
  --gold-lt:   #FFF0D0;
  --silver:    #7090B8;
  --silver-lt: #EAF0F8;
  --morada:    #9B59D0;
  --morada-lt: #F0E8FA;
  --success:   #2D9B6F;
  --success-lt:#E8FAF4;
  --danger:    #C0392B;
  --danger-lt: #FDE8E6;
  --warn:      #D4800A;
  --warn-lt:   #FFF3E0;
  --shadow-sm: 0 1px 4px rgba(74,26,107,0.08);
  --shadow-md: 0 4px 20px rgba(74,26,107,0.12);
  --shadow-lg: 0 12px 48px rgba(74,26,107,0.18);
  --radius:    14px;
  --radius-sm: 8px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--lavender);border-radius:3px}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  background:linear-gradient(135deg,#C9A8E8 0%,#B48DD6 50%,#9B6EC4 100%)}
.login-card{background:#6B2FA0;border-radius:24px;padding:48px 40px;width:100%;max-width:400px;
  box-shadow:var(--shadow-lg);text-align:center;animation:fadeUp .5s ease}
.login-logo{height:72px;width:auto;margin:0 auto 20px;display:block}
.login-card h1{font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--plum);margin-bottom:4px}
.login-card p{color:rgba(255,255,255,.8);font-size:.9rem;margin-bottom:32px}
.input-group{text-align:left;margin-bottom:16px}
.input-group label{display:block;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.9);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.input-group input{width:100%;border:2px solid rgba(255,255,255,.3);border-radius:var(--radius-sm);
  padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:.95rem;color:#fff;
  background:rgba(255,255,255,.15);transition:.2s;outline:none}
.input-group input::placeholder{color:rgba(255,255,255,.5)}
.input-group input:focus{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.25)}.input-group input::placeholder{color:rgba(255,255,255,.5)}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--plum),var(--plum-mid));
  color:var(--white);border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;
  font-size:1rem;font-weight:600;cursor:pointer;transition:.2s;letter-spacing:.3px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(74,26,107,.35)}
.btn-primary:active{transform:none}
.login-err{color:var(--danger);font-size:.85rem;margin-top:12px;min-height:20px}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:linear-gradient(90deg,var(--plum),var(--plum-mid));color:var(--white);
  padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(74,26,107,.3)}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{width:34px;height:34px;border-radius:6px;display:block}
.topbar-title{font-family:'DM Serif Display',serif;font-size:1.15rem;letter-spacing:.3px}
.topbar-subtitle{font-size:.75rem;opacity:.7}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-user{font-size:.82rem;opacity:.85}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:var(--white);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;
  font-family:'DM Sans',sans-serif;transition:.2s}
.btn-logout:hover{background:rgba(255,255,255,.25)}

/* ── NAV ── */
.nav-tabs{background:var(--white);border-bottom:2px solid var(--border);
  padding:0 24px;display:flex;gap:0;overflow-x:auto;flex-shrink:0}
.nav-tab{padding:14px 20px;font-size:.85rem;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
  white-space:nowrap;transition:.2s;display:flex;align-items:center;gap:6px}
.nav-tab:hover{color:var(--plum-mid)}
.nav-tab.active{color:var(--plum);border-bottom-color:var(--plum);font-weight:600}
.nav-tab .tab-icon{font-size:1rem}

/* ── CONTENT ── */
.content{flex:1;padding:28px 24px;max-width:1300px;margin:0 auto;width:100%}

/* ── CARDS / KPIs ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.kpi-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);
  border:1px solid var(--border);transition:.2s}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-label{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--plum)}
.kpi-sub{font-size:.78rem;color:var(--muted);margin-top:4px}
.kpi-card.gold .kpi-value{color:var(--gold)}
.kpi-card.silver .kpi-value{color:var(--silver)}
.kpi-card.morada .kpi-value{color:var(--morada)}

/* ── TABLE ── */
.table-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  border:1px solid var(--border);overflow:hidden}
.table-header{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.table-header h2{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--ink)}
.table-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-box{border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;
  font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--ink);background:var(--cream);
  outline:none;transition:.2s;width:220px}
.search-box:focus{border-color:var(--plum-lt)}
.filter-select{border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;
  font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--ink);background:var(--cream);
  outline:none;cursor:pointer;transition:.2s}
.filter-select:focus{border-color:var(--plum-lt)}
.btn-add{background:var(--plum);color:var(--white);border:none;border-radius:var(--radius-sm);
  padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s;white-space:nowrap}
.btn-add:hover{background:var(--plum-mid);box-shadow:0 4px 12px rgba(74,26,107,.3)}

table{width:100%;border-collapse:collapse}
thead tr{background:var(--cream)}
th{padding:11px 16px;text-align:left;font-size:.75rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border)}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:.88rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.15s}
tbody tr:hover{background:var(--cream)}

/* ── PILLS ── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:.75rem;font-weight:600;letter-spacing:.3px}
.pill-gold{background:var(--gold-lt);color:#8B5A00}
.pill-silver{background:var(--silver-lt);color:#3A5A7A}
.pill-morada{background:var(--morada-lt);color:var(--plum)}
.pill-active{background:var(--success-lt);color:var(--success)}
.pill-expiring{background:var(--warn-lt);color:var(--warn)}
.pill-expired{background:var(--danger-lt);color:var(--danger)}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── ACTION BTNS ── */
.btn-icon{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;
  cursor:pointer;font-size:.82rem;color:var(--muted);transition:.2s;display:inline-flex;align-items:center;gap:4px}
.btn-icon:hover{border-color:var(--plum-lt);color:var(--plum);background:var(--morada-lt)}
.btn-icon.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-lt)}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,10,46,.55);z-index:200;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex;animation:fadeIn .2s ease}
.modal{background:var(--white);border-radius:20px;width:100%;max-width:540px;
  max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:fadeUp .25s ease}
.modal-head{padding:24px 24px 0;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-family:'DM Serif Display',serif;font-size:1.35rem;color:var(--ink)}
.modal-close{background:none;border:none;font-size:1.4rem;color:var(--muted);cursor:pointer;
  width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{background:var(--border);color:var(--ink)}
.modal-body{padding:20px 24px 28px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.78rem;font-weight:600;color:var(--plum);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;border:2px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:.9rem;
  color:var(--ink);background:var(--cream);outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:var(--plum-lt);background:var(--white)}
.form-group textarea{resize:vertical;min-height:70px}
.form-hint{font-size:.75rem;color:var(--muted);margin-top:5px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
.btn-cancel{background:var(--cream);border:2px solid var(--border);color:var(--muted);
  padding:10px 20px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-cancel:hover{border-color:var(--muted)}
.btn-save{background:linear-gradient(135deg,var(--plum),var(--plum-mid));color:var(--white);
  border:none;padding:10px 24px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-save:hover{box-shadow:0 4px 14px rgba(74,26,107,.35)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}

/* ── SERVICE MODAL ── */
.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.service-btn{border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px;
  background:var(--cream);cursor:pointer;text-align:left;transition:.2s;font-family:'DM Sans',sans-serif}
.service-btn:hover{border-color:var(--plum-lt);background:var(--morada-lt)}
.service-btn.selected{border-color:var(--plum);background:var(--morada-lt)}
.service-btn .svc-name{font-size:.88rem;font-weight:600;color:var(--ink)}
.service-btn .svc-left{font-size:.75rem;color:var(--muted);margin-top:2px}
.service-btn .svc-left.none{color:var(--danger)}
.service-btn.depleted{opacity:.5;cursor:not-allowed}

/* ── CLIENT DETAIL ── */
.detail-header{display:flex;gap:20px;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap}
.detail-avatar{width:64px;height:64px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  background:linear-gradient(135deg,var(--plum),var(--plum-lt))}
.detail-info h2{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--ink)}
.detail-info p{color:var(--muted);font-size:.88rem;margin-top:2px}
.detail-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.svc-card{background:var(--white);border:2px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.svc-card .svc-icon{font-size:1.6rem;margin-bottom:8px}
.svc-card .svc-title{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.svc-card .svc-count{font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--plum)}
.svc-card .svc-total{font-size:.75rem;color:var(--muted)}
.svc-card.depleted{border-color:var(--danger);background:var(--danger-lt)}
.svc-card.depleted .svc-count{color:var(--danger)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--plum);transition:.4s}
.progress-fill.warn{background:var(--warn)}
.progress-fill.danger{background:var(--danger)}

/* ── HISTORY TABLE ── */
.section-title{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--ink);margin-bottom:12px}

/* ── VENCIMIENTOS ── */
.alert-card{border-radius:var(--radius);padding:16px 20px;margin-bottom:12px;
  display:flex;align-items:center;gap:16px;border:1px solid}
.alert-card.expiring{background:var(--warn-lt);border-color:#F0C060}
.alert-card.expired{background:var(--danger-lt);border-color:#E8A0A0}
.alert-icon{font-size:1.4rem;flex-shrink:0}
.alert-name{font-weight:600;color:var(--ink);font-size:.95rem}
.alert-sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.alert-days{font-weight:700;font-size:.9rem}
.alert-days.expiring{color:var(--warn)}
.alert-days.expired{color:var(--danger)}

/* ── CHARTS ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
@media(max-width:700px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--white);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.chart-card h3{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--ink);margin-bottom:16px}
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{font-size:.8rem;color:var(--muted);width:90px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:22px;background:var(--border);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;
  padding-right:8px;font-size:.72rem;font-weight:700;color:var(--white);transition:.6s}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold),#F0B040)}
.bar-fill.silver{background:linear-gradient(90deg,var(--silver),#90A8C8)}
.bar-fill.morada{background:linear-gradient(90deg,var(--morada),var(--plum-lt))}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--ink);color:var(--white);padding:12px 18px;border-radius:10px;
  font-size:.85rem;box-shadow:var(--shadow-lg);animation:slideIn .3s ease;
  display:flex;align-items:center;gap:8px;max-width:320px}
.toast-item.success{background:var(--success)}
.toast-item.error{background:var(--danger)}
.toast-item.warn{background:var(--warn)}

/* ── SYNC INDICATOR ── */
.sync-bar{background:var(--morada-lt);border-bottom:1px solid var(--border);
  padding:6px 24px;font-size:.78rem;color:var(--plum);display:none;align-items:center;gap:8px}
.sync-bar.show{display:flex}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--plum-lt);animation:pulse 1s infinite}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:.95rem}

/* ── TABS WITHIN PAGES ── */
.page-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px}
.page-tab{padding:10px 18px;font-size:.85rem;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.page-tab.active{color:var(--plum);border-bottom-color:var(--plum);font-weight:600}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .content{padding:16px 12px}
  .form-row{grid-template-columns:1fr}
  .topbar-subtitle{display:none}
  .service-grid{grid-template-columns:1fr}
  .charts-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
}

/* ── CREDENTIAL BOX ── */
.cred-box{background:var(--plum);color:var(--white);border-radius:12px;padding:16px 20px;margin-top:16px}
.cred-box h4{font-size:.8rem;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.cred-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cred-label{font-size:.82rem;opacity:.8}
.cred-value{font-size:.9rem;font-weight:700;font-family:monospace;background:rgba(255,255,255,.15);
  padding:3px 10px;border-radius:4px}

/* ── PLAN INFO BOX ── */
.plan-info-box{border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.85rem}
.plan-info-box.gold{background:var(--gold-lt);border:1px solid #E8C070;color:#6A4000}
.plan-info-box.silver{background:var(--silver-lt);border:1px solid #90A8C8;color:#2A4A6A}
.plan-info-box.morada{background:var(--morada-lt);border:1px solid var(--lavender);color:var(--plum)}

/* loading overlay */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.8);
  z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--plum);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ── LOGIN ── -->

let state = {

  usuarios: [],

  historial: [],
  pacientesTerapia: [],

// ════════════════════════════════════════════
// AUTH (local — usuarios admin en código, 
// clientes se cargan de Sheets)
// ════════════════════════════════════════════
// Staff ya NO se autentica aquí: las credenciales viven seguras en el backend (Code.gs).
// Esta lista es SOLO para mostrar nombres en la pestaña Usuarios (sin contraseñas).
const STAFF_USERS = [
  {username:'admin',    rol:'admin',    nombre:'Administrador'},
  {username:'personal', rol:'personal', nombre:'Personal'},
];

async function doLogin(){
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = 'Verificando…';
  try {
    // El SERVIDOR valida usuario y contraseña. Si es cliente, devuelve SOLO sus datos.
    const r = await apiCall('login', { usuario: u, password: p });
    if(r.role === 'cliente'){
      state.session = { username:u.toLowerCase(), rol:'cliente', nombre:r.profile.nombre, clienteId:r.profile.id, token:r.token };
      state.clientes = [r.profile];
      state.consumos = r.consumos || [];
    } else if(r.role === 'cliente_terapia'){
      state.session = { username:u.toLowerCase(), rol:'cliente_terapia', nombre:r.profile.nombre, pacienteId:r.profile.id, token:r.token };
      state.pacientesTerapia = [r.profile];
      state.sesionesTerapia = r.sesiones || [];
    } else {
      state.session = { username:u.toLowerCase(), rol:r.role, nombre:r.nombre, token:r.token };
    }
    err.textContent = '';
    startApp();
  } catch(e){
    err.textContent = 'Usuario o contraseña incorrectos.';
  }
}

document.getElementById('login-pass').addEventListener('keydown', e=>{
  if(e.key==='Enter') doLogin();
});

function doLogout(){
  state.session = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}

// ════════════════════════════════════════════
// GOOGLE SHEETS — API
// ════════════════════════════════════════════
async function apiCall(action, data={}){
  // Mandamos el token de SESIÓN (lo entrega el login). En el propio login aún no hay, va vacío.
  const token = (state.session && state.session.token) ? state.session.token : '';
  const body = JSON.stringify({action, token, ...data});
  const res = await fetch(SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'}, // text/plain evita preflight
    body
  });
  const json = await res.json();
  if(!json.ok){
    if(json.error === 'no_autorizado'){
      doLogout();
      throw new Error('Sesión expirada. Iniciá sesión de nuevo.');
    }
    throw new Error(json.error || 'Error desconocido');
  }
  return json;
}

async function loadFromSheets(){
  showSync('Cargando datos desde Google Sheets…');
  try {
    const rol = state.session.rol;
    if(rol === 'terapista'){
      const r = await apiCall('getAllTerapias');
      state.pacientesTerapia = r.pacientes || [];
      state.combos = r.combos || [];
      state.sesionesTerapia = r.sesiones || [];
    } else {
      const r = await apiCall('getAll');
      state.clientes = r.clientes || [];
      state.consumos = r.consumos || [];
      state.usuarios = r.usuarios || [];
      if(rol === 'admin' || rol === 'personal'){
        const rt = await apiCall('getAllTerapias');
        state.pacientesTerapia = rt.pacientes || [];
        state.combos = rt.combos || [];
        state.sesionesTerapia = rt.sesiones || [];
      }
    }
    hideSync();
    return true;
  } catch(e){
    hideSync();
    if(SCRIPT_URL.includes('TU_APPS_SCRIPT')){
      toast('⚠️ Apps Script no configurado — modo demo local','warn');
    } else {
      toast('Error al cargar Sheets: '+e.message,'error');
    }
    return false;
  }
}

// ════════════════════════════════════════════
// APP INIT
// ════════════════════════════════════════════
async function startApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  document.getElementById('topbar-user').textContent = state.session.nombre;
  const btnClave = document.getElementById('btn-cambiar-clave');
  if(btnClave) btnClave.style.display = (state.session.rol === 'personal') ? '' : 'none';

  const rol = state.session.rol;
  if(rol === 'cliente'){
    buildNav();
    renderPage('mi-membresia');
  } else if(rol === 'cliente_terapia'){
    buildNav();
    renderPage('mis-terapias');
  } else {
    await loadFromSheets();
    buildNav();
    renderPage(rol === 'terapista' ? 'terapias' : 'clientes');
  }
}

function buildNav(){
  const rol = state.session.rol;
  const tabs = [];
  if(rol==='cliente'){

function statusCliente(c){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const fin = new Date(c.fechaFin);
  const diff = Math.round((fin-hoy)/(1000*60*60*24));
  if(diff < 0)  return {label:'Vencida',   pill:'pill-expired',  days:diff};
  if(diff <= 30) return {label:'Por vencer',pill:'pill-expiring', days:diff};
  return               {label:'Activa',    pill:'pill-active',   days:diff};
}

function consumosPorCliente(clienteId){
  return state.consumos.filter(c=>c.clienteId===clienteId);
}

function serviciosUsados(clienteId){
  const usados = {};
  consumosPorCliente(clienteId).forEach(c=>{
    // Para laboratorio sumamos la cantidad; para el resto cuenta como 1
    const plan = state.clientes.find(x=>x.id===clienteId)?.plan;
    const svcDef = plan ? PLANES[plan]?.servicios[c.servicio] : null;
    const inc = (svcDef?.cantidadVariable && c.cantidad) ? Number(c.cantidad) : 1;
    usados[c.servicio] = (usados[c.servicio]||0) + inc;
  });
  return usados;
}

function serviciosRestantes(clienteId, plan){
  const p = PLANES[plan];
  if(!p) return {};
  const usados = serviciosUsados(clienteId);
  const restantes = {};
  Object.entries(p.servicios).forEach(([k,v])=>{
    restantes[k] = Math.max(0, v.total - (usados[k]||0));
  });
  return restantes;
}

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function genTempPass(){
  return Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,6);
}

function formatDate(d){
  if(!d) return '—';
  // Parse YYYY-MM-DD as local date to avoid UTC midnight offset bug
  if(typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)){
    const [y,mo,day] = d.split('-').map(Number);
    const dt = new Date(y, mo-1, day);
    return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
  }
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
}

function addDays(date, days){
  const d = new Date(date);
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}

function showSync(msg){ 
  document.getElementById('sync-msg').textContent=msg;
  document.getElementById('sync-bar').classList.add('show');
}
function hideSync(){ document.getElementById('sync-bar').classList.remove('show'); }
function showLoading(){ document.getElementById('loading-overlay').classList.add('show'); }

function toast(msg, type='success', dur=3500){
  const t = document.createElement('div');
  t.className = 'toast-item '+type;
  t.innerHTML = msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(()=>t.remove(), dur);
}

function closeModal(e){
  if(e && e.target!==document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}
function openModal(title, body){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;

}

function renderClientTable(){
  const q = clientFilter.q.toLowerCase();
  let list = state.clientes.filter(c=>{
    const matchQ = !q || c.nombre?.toLowerCase().includes(q) 
      || c.cedula?.toString().includes(q)
      || c.mascota?.toLowerCase().includes(q);
    const matchPlan = !clientFilter.plan || c.plan===clientFilter.plan;
    const st = statusCliente(c).label;
    const matchStatus = !clientFilter.status || st===clientFilter.status;
    return matchQ && matchPlan && matchStatus;
  });

  const ultimoConsumo = {};
  (state.consumos||[]).forEach(co=>{
    const f = co.fecha ? new Date(co.fecha).getTime() : 0;
    if(!isNaN(f) && (!ultimoConsumo[co.clienteId] || f > ultimoConsumo[co.clienteId])) ultimoConsumo[co.clienteId] = f;
  });
  const sort = clientFilter.sort || 'reciente';
  list.sort((a,b)=>{
    if(sort==='nombre-az') return (a.nombre||'').localeCompare(b.nombre||'', 'es');
    if(sort==='nombre-za') return (b.nombre||'').localeCompare(a.nombre||'', 'es');
    if(sort==='inicio-desc') return new Date(b.fechaInicio||0) - new Date(a.fechaInicio||0);
    if(sort==='inicio-asc')  return new Date(a.fechaInicio||0) - new Date(b.fechaInicio||0);
    return (ultimoConsumo[b.id]||0) - (ultimoConsumo[a.id]||0); // reciente (default)
  });

  document.getElementById('client-count').textContent = list.length;
  const tbody = document.getElementById('client-tbody');
  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="7">
      <div class="empty-state"><div class="empty-icon">🔍</div><p>No hay clientes que coincidan</p></div>
    </td></tr>`;
    return;
  }

  const isStaff = state.session.rol!=='cliente';
  tbody.innerHTML = list.map(c=>{
    const st = statusCliente(c);
    return `<tr>
      <td>
        <div style="font-weight:600">${c.nombre}</div>
        <div style="font-size:.75rem;color:var(--muted)">${c.cedula||'—'}</div>
      </td>
      <td>${c.mascota||'—'}</td>
      <td>${pillPlan(c.plan)}</td>
      <td style="font-size:.82rem">${formatDate(c.fechaInicio)}</td>
      <td style="font-size:.82rem">${formatDate(c.fechaFin)}</td>
      <td><span class="pill ${st.pill}"><span class="pill-dot"></span>${st.label}</span></td>
      <td>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn-icon" onclick="verCliente('${c.id}')">👁 Ver</button>
          ${isStaff && !PLANES[c.plan]?.soloDescuentos ? `<button class="btn-icon" onclick="openRegistrarConsumo('${c.id}')">＋ Servicio</button>` : ''}
          ${(state.session.rol==='admin' || state.session.rol==='personal') ? `
            <button class="btn-icon" onclick="openEditarCliente('${c.id}')">✏️ Editar</button>
          ` : ''}
          ${state.session.rol==='personal' ? `
            <button class="btn-icon" onclick="verCredencialCliente('${c.id}')">🔑 Acceso</button>
          ` : ''}
          ${state.session.rol==='admin' ? `
            <button class="btn-icon danger" onclick="eliminarCliente('${c.id}')">🗑</button>
          ` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function verCliente(id){
  const c = state.clientes.find(x=>x.id===id);
  if(!c) return;
  const plan = PLANES[c.plan];
  const st   = statusCliente(c);
  const usados = serviciosUsados(id);
  const consumos = consumosPorCliente(id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const esMorada = plan.soloDescuentos;

  const svcsHTML = esMorada
    ? `<div style="background:var(--morada-lt);border:1px solid var(--lavender);border-radius:12px;
          padding:20px 24px;display:flex;align-items:center;gap:14px;margin-bottom:4px">
        <div style="font-size:2rem">💜</div>
        <div>
          <div style="font-weight:700;color:var(--plum);margin-bottom:4px">Plan Morada · Membresía de descuentos</div>
          <div style="font-size:.85rem;color:var(--muted)">Este plan incluye descuentos especiales en productos y servicios de Animal Center. No incluye servicios prepagados.</div>
        </div>

    : Object.entries(plan.servicios).map(([k,v])=>{
        const usado = usados[k]||0;
        const resto = Math.max(0, v.total-usado);
        const pct   = v.total ? Math.round((resto/v.total)*100) : 0;
        const depleted = resto===0 && v.total>0;
        const fillClass = pct<=25?'danger':pct<=60?'warn':'';
        return `<div class="svc-card ${depleted?'depleted':''}">
          <div class="svc-icon">${v.icon}</div>
          <div class="svc-title">${v.label}</div>
          <div class="svc-count">${resto}</div>
          <div class="svc-total">${resto} restante${resto!==1?'s':''} de ${v.total}</div>
          <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
        </div>`;
      }).join('');

  const histHTML = consumos.length ? `
    <table>
      <thead><tr><th>Fecha</th><th>Servicio</th><th>Notas</th><th>Registrado por</th></tr></thead>
      <tbody>${consumos.map(co=>`

          <td>${plan.servicios[co.servicio]?.icon||''} ${plan.servicios[co.servicio]?.label||co.servicio}</td>
          <td style="font-size:.82rem;color:var(--muted)">${co.notas||'—'}</td>
          <td style="font-size:.78rem;color:var(--muted)">${co.registradoPor||'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>` : `<div class="empty-state" style="padding:24px"><div class="empty-icon">📋</div><p>Sin consumos registrados</p></div>`;

  openModal(`🐾 ${c.nombre}`, `
    <div class="detail-header">
      <div class="detail-avatar">🐾</div>
      <div class="detail-info">
        <h2>${c.nombre}</h2>
        <p>${c.especie||'Mascota'}: <strong>${c.mascota}</strong> · CC: ${c.cedula}</p>
        ${c.tel?`<p>📞 ${c.tel}</p>`:''}
        <div class="detail-meta">
          ${pillPlan(c.plan)}
          <span class="pill ${st.pill}"><span class="pill-dot"></span>${st.label} · ${
            st.days<0?'venció hace '+Math.abs(st.days)+' días':st.days+' días restantes'
          }</span>
        </div>
        <p style="font-size:.78rem;color:var(--muted);margin-top:6px">
          ${formatDate(c.fechaInicio)} → ${formatDate(c.fechaFin)}
        </p>
      </div>
    </div>
    <div class="section-title">${esMorada ? 'Beneficios del plan' : 'Servicios incluidos'}</div>

async function guardarEdicion(id){
  const campos = {
    nombre:  document.getElementById('ed-nombre').value.trim(),
    cedula:  document.getElementById('ed-cedula').value.trim(),
    mascota: document.getElementById('ed-mascota').value.trim(),
    especie: document.getElementById('ed-especie').value,
    plan:    document.getElementById('ed-plan').value,
    fechaInicio: document.getElementById('ed-inicio').value,
    tel:     document.getElementById('ed-tel').value.trim(),
    email:   document.getElementById('ed-email').value.trim(),
  };
  if(!campos.nombre||!campos.cedula||!campos.mascota){
    toast('Nombre, cédula y mascota son obligatorios','error'); return;
  }
  showLoading();
  try {
    await apiCall('updateCliente', { clienteId: id, campos });
    const idx = state.clientes.findIndex(x=>x.id===id);
    if(idx>=0) state.clientes[idx] = {...state.clientes[idx], ...campos};
    closeModal(); hideLoading();
    toast('✅ Cliente actualizado');
    renderClientTable();
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

function solMarkChanged(input, original){
  const val = input.value.trim();
  const changed = val !== '' && val !== original;
  input.style.borderColor = changed ? 'var(--success)' : '';
  input.style.background  = changed ? 'var(--success-lt)' : '';
  // Update the changes preview
  const cambios = [];
  const fields = [
    {id:'sol-nombre',  label:'Nombre',   orig: _solOriginal.nombre},
    {id:'sol-cedula',  label:'Cédula',   orig: _solOriginal.cedula},
    {id:'sol-mascota', label:'Mascota',  orig: _solOriginal.mascota},
    {id:'sol-tel',     label:'Teléfono', orig: _solOriginal.tel},
    {id:'sol-email',   label:'Correo',   orig: _solOriginal.email},
  ];
  fields.forEach(f=>{
    const el = document.getElementById(f.id);
    if(!el) return;
    const v = el.value.trim();
    if(v && v !== f.orig) cambios.push(`<strong>${f.label}:</strong> "${f.orig||'vacío'}" → "${v}"`);
  });
  const preview = document.getElementById('sol-cambios-preview');
  const lista   = document.getElementById('sol-cambios-lista');
  if(preview && lista){
    preview.style.display = cambios.length ? '' : 'none';
    lista.innerHTML = cambios.join('<br>');
  }
}

function solSwitchTab(tab){
  ['datos','servicio','eliminar'].forEach(t=>{
    document.getElementById('sol-tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('sol-panel-'+t).style.display = t===tab ? '' : 'none';
  });
}

async function submitSolicitud(tipo, clienteId, panel){
  let datos = {};
  if(panel === 'datos'){
    const motivo = document.getElementById('sol-motivo-datos')?.value.trim();
    if(!motivo){ toast('Explicá el motivo de la corrección','error'); return; }
    // Only send fields that actually changed
    const cambios = {};
    const fields = [
      {id:'sol-nombre',  key:'nombre',  orig: _solOriginal.nombre},
      {id:'sol-cedula',  key:'cedula',  orig: _solOriginal.cedula},
      {id:'sol-mascota', key:'mascota', orig: _solOriginal.mascota},
      {id:'sol-tel',     key:'tel',     orig: _solOriginal.tel},
      {id:'sol-email',   key:'email',   orig: _solOriginal.email},
    ];
    fields.forEach(f=>{
      const v = document.getElementById(f.id)?.value.trim();
      if(v && v !== f.orig) cambios[f.key] = v;
    });
    if(!Object.keys(cambios).length){ toast('No detecté cambios — modificá al menos un campo','error'); return; }
    datos = { cambios, motivo };
  } else if(panel === 'servicio'){
    const motivo = document.getElementById('sol-motivo-servicio')?.value.trim();
    if(!motivo){ toast('Describí qué hay que corregir','error'); return; }
    datos = { consumoId: document.getElementById('sol-consumo-id')?.value, motivo };
  } else if(panel === 'eliminar'){
    const motivo = document.getElementById('sol-motivo-eliminar')?.value.trim();
    if(!motivo){ toast('El motivo es obligatorio','error'); return; }
    datos = { motivo };
  }

  showLoading();
  try {
    await apiCall('addSolicitud', { solicitud: { tipo, clienteId, datos } });
    closeModal(); hideLoading();
    toast('✅ Solicitud enviada — el administrador la revisará');
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

function openRegistrarConsumo(clienteId){
  const c = state.clientes.find(x=>x.id===clienteId);
  if(!c) return;
  const plan = PLANES[c.plan];
  const restantes = serviciosRestantes(clienteId, c.plan);

  const btns = Object.entries(plan.servicios).map(([k,v])=>{
    const r = restantes[k];
    const depleted = v.total>0 && r===0;
    const noIncluded = v.total===0;
    return `<button class="service-btn ${depleted||noIncluded?'depleted':''}" 
      id="svc-btn-${k}"
      ${depleted||noIncluded?'disabled':''}
      onclick="toggleSvc('${k}',${depleted||noIncluded},${!!v.cantidadVariable},${r||0})">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="svc-check" id="svc-check-${k}" style="width:18px;height:18px;border-radius:4px;
          border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
          flex-shrink:0;font-size:.7rem;background:var(--white)"></span>
        <div>
          <div class="svc-name">${v.icon} ${v.label}${v.cantidadVariable?' <span style="font-size:.7rem;background:var(--plum);color:#fff;padding:1px 6px;border-radius:8px;margin-left:4px">cantidad variable</span>':''}</div>
          <div class="svc-left ${noIncluded?'none':depleted?'none':''}">${
            noIncluded?'No incluido en este plan':
            depleted?'Sin usos disponibles':
            `${r} restante${r!==1?'s':''} de ${v.total}`
          }</div>
        </div>
      </div>
    </button>`;
  }).join('');

  openModal(`Registrar servicios — ${c.nombre}`, `
    <p style="color:var(--muted);margin-bottom:16px;font-size:.88rem">
      ${pillPlan(c.plan)} · ${c.mascota} · Puedes seleccionar varios servicios a la vez
    </p>
    <div class="form-group">
      <label>Selecciona los servicios <span id="svc-count-label" style="color:var(--plum-mid);font-size:.8rem"></span></label>
      <div class="service-grid">${btns}</div>
    </div>
    <div id="lab-cantidad-box" style="display:none;margin-bottom:16px">
      <div style="background:var(--morada-lt);border:1px solid var(--lavender);border-radius:10px;padding:14px 16px">
        <label style="display:block;font-size:.78rem;font-weight:700;color:var(--plum);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">
          🧪 ¿Cuántos exámenes de sangre se realizaron?
        </label>
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="ajustarLab(-1)" style="width:34px;height:34px;border-radius:8px;border:2px solid var(--plum-lt);background:var(--white);font-size:1.2rem;cursor:pointer;color:var(--plum);font-weight:700;display:flex;align-items:center;justify-content:center">−</button>
          <input type="number" id="lab-cantidad" min="1" max="10" value="1"
            style="width:64px;text-align:center;border:2px solid var(--plum-lt);border-radius:8px;
            padding:6px;font-size:1.1rem;font-weight:700;color:var(--plum);font-family:'DM Sans',sans-serif"
            oninput="validarLab()">
          <button onclick="ajustarLab(1)" style="width:34px;height:34px;border-radius:8px;border:2px solid var(--plum-lt);background:var(--white);font-size:1.2rem;cursor:pointer;color:var(--plum);font-weight:700;display:flex;align-items:center;justify-content:center">+</button>
          <span id="lab-restantes-info" style="font-size:.82rem;color:var(--muted);margin-left:4px"></span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Fecha del servicio</label>
      <input type="date" id="svc-fecha" value="${new Date().toISOString().slice(0,10)}">
    </div>
    <div class="form-group">
      <label>Notas (opcional)</label>
      <textarea id="svc-notas" placeholder="Observaciones, medicamentos, etc."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" id="btn-guardar-svc" onclick="guardarConsumo('${clienteId}')" disabled>
        Guardar <span id="btn-svc-label">servicios</span>
      </button>
    </div>
  `);
  window._svcSeleccionados = new Set();
  window._labMaxRestantes = 0;
}

function ajustarLab(delta){
  const inp = document.getElementById('lab-cantidad');
  if(!inp) return;
  const max = window._labMaxRestantes || 10;
  inp.value = Math.min(max, Math.max(1, (parseInt(inp.value)||1) + delta));
  validarLab();
}

function validarLab(){
  const inp = document.getElementById('lab-cantidad');
  const max = window._labMaxRestantes || 10;
  if(!inp) return;
  let v = parseInt(inp.value)||1;
  if(v < 1) v = 1;
  if(v > max) v = max;
  inp.value = v;
  const info = document.getElementById('lab-restantes-info');
  if(info) info.textContent = `máx. disponibles: ${max}`;
}

function toggleSvc(k, disabled, esVariable, restantes){
  if(disabled) return;
  const sel = window._svcSeleccionados;
  const check = document.getElementById('svc-check-'+k);
  const btn   = document.getElementById('svc-btn-'+k);
  if(sel.has(k)){
    sel.delete(k);
    btn.classList.remove('selected');
    check.textContent='';
    check.style.background='var(--white)';
    check.style.borderColor='var(--border)';
  } else {
    sel.add(k);
    btn.classList.add('selected');
    check.textContent='✓';
    check.style.background='var(--plum)';
    check.style.borderColor='var(--plum)';
    check.style.color='white';
  }
  // Mostrar/ocultar campo de cantidad para laboratorio
  const labBox = document.getElementById('lab-cantidad-box');
  if(labBox){
    const labSeleccionado = sel.has('laboratorio');
    labBox.style.display = labSeleccionado ? 'block' : 'none';
    if(labSeleccionado && esVariable){
      window._labMaxRestantes = restantes;
      const inp = document.getElementById('lab-cantidad');
      if(inp){ inp.max = restantes; inp.value = 1; }
      validarLab();
    }
  }
  const n = sel.size;
  document.getElementById('btn-guardar-svc').disabled = n===0;
  document.getElementById('svc-count-label').textContent = n>0?`(${n} seleccionado${n>1?'s':''})` : '';
  document.getElementById('btn-svc-label').textContent = n>1?`${n} servicios`:'servicio';
}

async function guardarConsumo(clienteId){
  const svcs  = Array.from(window._svcSeleccionados||[]);
  const fecha = document.getElementById('svc-fecha').value;
  const notas = document.getElementById('svc-notas').value.trim();
  if(!svcs.length){ toast('Selecciona al menos un servicio','error'); return; }

  const cliente = state.clientes.find(x=>x.id===clienteId);
  const plan    = PLANES[cliente?.plan];

  const nuevos = svcs.map(svc=>{
    const svcDef = plan?.servicios[svc];
    // Para laboratorio, leer la cantidad digitada
    const cantidad = (svcDef?.cantidadVariable && svcs.includes('laboratorio') && svc==='laboratorio')
      ? (parseInt(document.getElementById('lab-cantidad')?.value)||1)
      : 1;
    return {
      id: genId(), clienteId, servicio: svc, fecha,
      cantidad, notas,
      registradoPor: state.session.nombre,
      creadoEn: new Date().toISOString()
    };
  });

  showLoading();
  try {
    await Promise.all(nuevos.map(co=>apiCall('addConsumo',{consumo:co, notificarEmail:true})));
    nuevos.forEach(co=>state.consumos.push(co));
    closeModal(); hideLoading();
    const labNuevo = nuevos.find(c=>c.servicio==='laboratorio');
    const labMsg   = labNuevo && labNuevo.cantidad>1 ? ` (${labNuevo.cantidad} exámenes de sangre)` : '';
    toast(`✅ ${svcs.length} servicio${svcs.length>1?'s':''} registrado${svcs.length>1?'s':''}${labMsg} · Notificación enviada`);
    renderClientTable();
  } catch(e){
    hideLoading();
    toast('Error: '+e.message,'error');
  }
}

async function confirmarEliminar(id){
  showLoading();
  try {
    await apiCall('deleteCliente',{clienteId:id});
    state.clientes = state.clientes.filter(c=>c.id!==id);
    state.consumos = state.consumos.filter(c=>c.clienteId!==id);
    closeModal(); hideLoading();
    toast('🗑 Cliente eliminado');
    renderClientTable();
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

let dashboardView = 'membresias';

function renderDashboard(c, view){
  if(view) dashboardView = view;
  if(dashboardView === 'terapias'){ renderDashboardTerapias(c); return; }

  const PRECIOS = { Gold: 650000, Silver: 350000, Morada: 60000 };
  const fmt = n => '$' + Math.round(n).toLocaleString('es-CO');

  // ── Helpers de fecha ──
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const yyyymm = d => { const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`; };
  const mesLabel = ym => { const [y,m]=ym.split('-'); return new Date(y,m-1,1).toLocaleDateString('es-CO',{month:'short',year:'2-digit'}); };

  // Últimos 6 meses (YYYY-MM)
  const meses = Array.from({length:6},(_,i)=>{
    const d = new Date(hoy.getFullYear(), hoy.getMonth()-5+i, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  });
  const mesActual  = meses[5];
  const mesAnterior = meses[4];

  // ── Por plan y estado ──
  const byPlan   = {Gold:0,Silver:0,Morada:0};
  const byStatus = {Activa:0,'Por vencer':0,Vencida:0};
  state.clientes.forEach(cl=>{
    byPlan[cl.plan] = (byPlan[cl.plan]||0)+1;
    byStatus[statusCliente(cl).label] = (byStatus[statusCliente(cl).label]||0)+1;
  });

  // ── Nuevos clientes por mes ──
  const nuevosPorMes = {};
  meses.forEach(m=>nuevosPorMes[m]=0);
  state.clientes.forEach(cl=>{
    const m = yyyymm(cl.fechaInicio||cl.creadoEn||'');
    if(nuevosPorMes[m]!==undefined) nuevosPorMes[m]++;
  });
  const nuevosEste = nuevosPorMes[mesActual]||0;
  const nuevosAnt  = nuevosPorMes[mesAnterior]||0;
  const crecimiento = nuevosAnt > 0 ? Math.round(((nuevosEste-nuevosAnt)/nuevosAnt)*100) : null;

  // ── Ingresos por mes (nuevas membresías × precio) ──
  const ingresosPorMes = {};
  meses.forEach(m=>ingresosPorMes[m]=0);
  state.clientes.forEach(cl=>{
    const m = yyyymm(cl.fechaInicio||cl.creadoEn||'');
    if(ingresosPorMes[m]!==undefined) ingresosPorMes[m] += PRECIOS[cl.plan]||0;
  });
  const ingresosEste = ingresosPorMes[mesActual]||0;
  const ingresosAnt  = ingresosPorMes[mesAnterior]||0;
  const totalAcumulado = state.clientes.reduce((s,cl)=>s+(PRECIOS[cl.plan]||0),0);

  // ── Actividad de servicios por mes ──
  const actividadPorMes = {};
  meses.forEach(m=>actividadPorMes[m]=0);
  state.consumos.forEach(co=>{
    const m = yyyymm(co.fecha||'');
    if(actividadPorMes[m]!==undefined) actividadPorMes[m]++;
  });

  // ── Servicios más usados ──
  const svcCount = {};
  state.consumos.forEach(co=>{ svcCount[co.servicio]=(svcCount[co.servicio]||0)+1; });
  const allSvcs = {consultas:'🩺 Consultas',ecografias:'🔬 Ecografías',
    laboratorio:'🧪 Laboratorio',vacunas:'💉 Vacunas',rayosX:'☢️ Rayos X',
    consultaEsp:'👨‍⚕️ Esp.',parcialOrina:'🧫 Orina'};
  const maxSvc = Math.max(...Object.values(svcCount),1);

  // ── Tasa de utilización Gold/Silver ──
  const calcUtilizacion = plan => {
    const clientes = state.clientes.filter(cl=>cl.plan===plan);
    if(!clientes.length) return 0;
    const svcs = PLANES[plan]?.servicios||{};
    const totalPosible = clientes.length * Object.values(svcs).reduce((s,v)=>s+v.total,0);
    if(!totalPosible) return 0;
    const totalUsado = clientes.reduce((s,cl)=>{
      const usados = serviciosUsados(cl.id);
      return s + Object.values(usados).reduce((a,b)=>a+b,0);
    },0);
    return Math.round((totalUsado/totalPosible)*100);
  };
  const utilGold   = calcUtilizacion('Gold');
  const utilSilver = calcUtilizacion('Silver');

  // ── Vencimientos este mes y el próximo ──
  const fin = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0); // último día del mes
  const ini2 = new Date(hoy.getFullYear(), hoy.getMonth()+1, 1);
  const fin2 = new Date(hoy.getFullYear(), hoy.getMonth()+2, 0);
  const vencenEsteMes  = state.clientes.filter(cl=>{ const f=new Date(cl.fechaFin); return f>=hoy&&f<=fin; }).length;
  const vencenProxMes  = state.clientes.filter(cl=>{ const f=new Date(cl.fechaFin); return f>=ini2&&f<=fin2; }).length;
  const ingresoRiesgo  = state.clientes.filter(cl=>{ const f=new Date(cl.fechaFin); return f>=hoy&&f<=fin2; })
                          .reduce((s,cl)=>s+(PRECIOS[cl.plan]||0),0);

  // ── Bar chart helper ──
  const barChart = (data, colorFn) => {
    const max = Math.max(...data.map(d=>d.v),1);
    return data.map(d=>`
      <div class="bar-row">
        <div class="bar-label" style="font-size:.72rem;width:54px">${d.label}</div>
        <div class="bar-track">
          <div class="bar-fill ${colorFn(d)}" style="width:${Math.round((d.v/max)*100)||2}%">${d.v||''}</div>
        </div>
      </div>`).join('');
  };

  const maxPlan = Math.max(...Object.values(byPlan),1);

  c.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button onclick="renderDashboard(document.getElementById('page-content'),'membresias')" style="padding:8px 20px;border-radius:20px;border:2px solid var(--plum);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--plum);color:#fff">💳 Membresías</button>
      <button onclick="renderDashboard(document.getElementById('page-content'),'terapias')" style="padding:8px 20px;border-radius:20px;border:2px solid var(--plum);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;background:transparent;color:var(--plum)">🐾 Terapias Físicas</button>
    </div>
    <!-- KPIs principales -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total clientes</div>
        <div class="kpi-value">${state.clientes.length}</div>
        <div class="kpi-sub">${nuevosEste} nuevo${nuevosEste!==1?'s':''} este mes${crecimiento!==null?` · <span style="color:${crecimiento>=0?'var(--success)':'var(--danger)'}">${crecimiento>=0?'↑':'↓'}${Math.abs(crecimiento)}% vs mes ant.</span>`:''}</div>
      </div>
      <div class="kpi-card gold">
        <div class="kpi-label">Plan Gold</div>
        <div class="kpi-value">${byPlan.Gold}</div>
        <div class="kpi-sub">Utilización: ${utilGold}%</div>
      </div>
      <div class="kpi-card silver">
        <div class="kpi-label">Plan Silver</div>
        <div class="kpi-value">${byPlan.Silver}</div>
        <div class="kpi-sub">Utilización: ${utilSilver}%</div>
      </div>
      <div class="kpi-card morada">
        <div class="kpi-label">Plan Morada</div>
        <div class="kpi-value">${byPlan.Morada}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Servicios este mes</div>
        <div class="kpi-value">${actividadPorMes[mesActual]||0}</div>
        <div class="kpi-sub">${state.consumos.length} total histórico</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Vencen próx. 30 días</div>
        <div class="kpi-value" style="color:var(--warn)">${byStatus['Por vencer']}</div>
        <div class="kpi-sub">Vencidas: <span style="color:var(--danger)">${byStatus['Vencida']}</span></div>
      </div>
    </div>

    <!-- Tendencia mensual -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>📈 Nuevos clientes por mes</h3>
        <div class="bar-chart">
          ${barChart(meses.map(m=>({label:mesLabel(m),v:nuevosPorMes[m]||0,m})), ()=>'morada')}
        </div>
      </div>
      <div class="chart-card">
        <h3>🩺 Servicios usados por mes</h3>
        <div class="bar-chart">
          ${barChart(meses.map(m=>({label:mesLabel(m),v:actividadPorMes[m]||0})), ()=>'morada')}
        </div>
      </div>
    </div>

    <!-- Distribución y servicios -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Distribución por plan</h3>
        <div class="bar-chart">
          ${barChart(Object.entries(byPlan).map(([plan,n])=>({label:PLANES[plan].icon+' '+plan,v:n,plan})), d=>PLANES[d.plan]?.color||'morada')}
        </div>
      </div>
      <div class="chart-card">
        <h3>Servicios más usados (histórico)</h3>
        <div class="bar-chart">
          ${barChart(Object.entries(allSvcs).map(([k,label])=>({label,v:svcCount[k]||0})), ()=>'morada')}
        </div>
      </div>
    </div>

    <!-- Estado y riesgo de renovación -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Estado de membresías</h3>
        <div style="display:flex;gap:24px;flex-wrap:wrap">
          ${[['Activa','✅',byStatus['Activa']||0,'success'],
             ['Por vencer','⚠️',byStatus['Por vencer']||0,'warn'],
             ['Vencida','❌',byStatus['Vencida']||0,'danger']].map(([label,icon,n,color])=>`
            <div style="text-align:center;min-width:90px">
              <div style="font-size:1.8rem">${icon}</div>
              <div style="font-family:'DM Serif Display',serif;font-size:2rem;color:var(--${color})">${n}</div>

            </div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <h3>⚠️ Riesgo de renovación</h3>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--warn-lt);border-radius:8px;border:1px solid #F0C060">
            <div>
              <div style="font-weight:600;font-size:.9rem">Vencen este mes</div>
              <div style="font-size:.78rem;color:var(--muted)">Si no renuevan</div>
            </div>
            <div style="text-align:right">
              <div style="font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--warn)">${vencenEsteMes}</div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--cream);border-radius:8px;border:1px solid var(--border)">

}

function toggleStaffPw(username, pw, btn){
  const el = document.getElementById('pw-staff-'+username);
  if(!el) return;
  const showing = btn.textContent === 'Ocultar';
  el.textContent = showing ? '••••••••' : pw;
  btn.textContent = showing ? 'Ver' : 'Ocultar';
}

function toggleClientePw(id, pw, btn){
  const el = document.getElementById('pw-cl-'+id);

async function guardarClaveStaff(username){
  const nueva = document.getElementById('cs-nueva')?.value.trim();
  if(!nueva || nueva.length < 6){ toast('Mínimo 6 caracteres','error'); return; }
  showLoading();
  try {
    await apiCall('updateStaffPassword', { username, nueva });
    closeModal(); hideLoading();
    toast('✅ Contraseña actualizada');
    await loadFromSheets();
    renderPage('usuarios');
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

async function guardarResetCliente(clienteId){
  const nueva = document.getElementById('rp-nueva')?.value.trim();
  if(!nueva || nueva.length < 4){ toast('Ingresá una contraseña válida','error'); return; }
  showLoading();
  try {
    await apiCall('resetClientePassword', { clienteId, nueva });
    const idx = state.clientes.findIndex(x=>x.id===clienteId);
    if(idx>=0) state.clientes[idx].password = nueva;
    closeModal(); hideLoading();
    toast('✅ Contraseña reseteada');
    renderPage('usuarios');
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

function filterUsuariosCliente(q){
  document.querySelectorAll('#usuarios-tbody tr').forEach(r=>{
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

function renderMiMembresia(c){
  const clienteId = state.session.clienteId;
  const cl = state.clientes.find(x=>x.id===clienteId);
  if(!cl){ c.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>No se encontró tu membresía.</p></div>'; return; }

  const plan = PLANES[cl.plan];
  const st   = statusCliente(cl);
  const usados = serviciosUsados(clienteId);
  const consumos = consumosPorCliente(clienteId).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const esMorada = plan.soloDescuentos;

  const svcsHTML = esMorada
    ? `<div style="background:var(--morada-lt);border:1px solid var(--lavender);border-radius:12px;
          padding:20px 24px;display:flex;align-items:center;gap:14px;margin-bottom:4px">
        <div style="font-size:2rem">💜</div>
        <div>
          <div style="font-weight:700;color:var(--plum);margin-bottom:4px">Plan Morada · Membresía de descuentos</div>
          <div style="font-size:.85rem;color:var(--muted)">Tu membresía incluye descuentos especiales en productos y servicios de Animal Center. Preséntala en cada visita para aplicar tu beneficio.</div>
        </div>
      </div>`
    : Object.entries(plan.servicios).map(([k,v])=>{
        const usado = usados[k]||0;
        const resto = Math.max(0, v.total-usado);
        const pct   = v.total ? Math.round((resto/v.total)*100) : 0;
        const depleted = resto===0 && v.total>0;
        const fillClass = pct<=25?'danger':pct<=60?'warn':'';
        return `<div class="svc-card ${depleted?'depleted':''}">
          <div class="svc-icon">${v.icon}</div>
          <div class="svc-title">${v.label}</div>
          <div class="svc-count">${resto}</div>
          <div class="svc-total">${resto} restante${resto!==1?'s':''} de ${v.total}</div>
          <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
        </div>`;
      }).join('');

  c.innerHTML = `
    <div class="detail-header">
      <div class="detail-avatar">🐾</div>
      <div class="detail-info">
        <h2>${cl.nombre}</h2>
        <p>${cl.especie||'Mascota'}: <strong>${cl.mascota}</strong></p>
        <div class="detail-meta">
          ${pillPlan(cl.plan)}
          <span class="pill ${st.pill}"><span class="pill-dot"></span>${st.label} · ${
            st.days<0?'venció hace '+Math.abs(st.days)+' días':st.days+' días restantes'
          }</span>
        </div>
        <p style="font-size:.78rem;color:var(--muted);margin-top:6px">
          Membresía: ${formatDate(cl.fechaInicio)} → ${formatDate(cl.fechaFin)}
        </p>
      </div>
    </div>

    <div class="section-title">${esMorada ? 'Beneficios del plan' : 'Mis servicios'}</div>
    <div class="${esMorada ? '' : 'services-grid'}">${svcsHTML}</div>

    ${!esMorada ? `<div class="section-title">Historial</div>
    <div class="table-card">
      ${consumos.length?`
      <table>
        <thead><tr><th>Fecha</th><th>Servicio</th><th>Notas</th></tr></thead>
        <tbody>${consumos.map(co=>`<tr>
          <td style="font-size:.82rem">${formatDate(co.fecha)}</td>
          <td>${plan.servicios[co.servicio]?.icon||''} ${plan.servicios[co.servicio]?.label||co.servicio}</td>
          <td style="font-size:.82rem;color:var(--muted)">${co.notas||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>`:`<div class="empty-state" style="padding:32px"><div class="empty-icon">📋</div><p>Sin servicios registrados aún</p></div>`}
    </div>` : ''}

    <div class="section-title">Seguridad</div>
    <div class="table-card" style="padding:20px 24px;max-width:460px">
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:14px">Cambiá tu contraseña cuando quieras. Mínimo 6 caracteres.</p>
      <div class="form-group" style="margin-bottom:10px"><label>Contraseña actual</label><div style="position:relative"><input type="password" id="pw-actual" autocomplete="current-password" style="width:100%;padding-right:62px"><button type="button" onclick="togglePw('pw-actual',this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:.78rem;font-weight:700;color:var(--plum,#6B2FA0)">Ver</button></div></div>
      <div class="form-group" style="margin-bottom:10px"><label>Nueva contraseña</label><div style="position:relative"><input type="password" id="pw-nueva" autocomplete="new-password" style="width:100%;padding-right:62px"><button type="button" onclick="togglePw('pw-nueva',this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:.78rem;font-weight:700;color:var(--plum,#6B2FA0)">Ver</button></div></div>
      <div class="form-group" style="margin-bottom:14px"><label>Repetir nueva contraseña</label><div style="position:relative"><input type="password" id="pw-nueva2" autocomplete="new-password" style="width:100%;padding-right:62px"><button type="button" onclick="togglePw('pw-nueva2',this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:.78rem;font-weight:700;color:var(--plum,#6B2FA0)">Ver</button></div></div>
      <button class="btn-primary" onclick="cambiarMiClave()">Cambiar contraseña</button>
      <div id="pw-msg" style="font-size:.82rem;margin-top:10px"></div>
    </div>
  `;
}

async function cambiarMiClave(){
  const actual = document.getElementById('pw-actual').value;
  const nueva  = document.getElementById('pw-nueva').value;
  const nueva2 = document.getElementById('pw-nueva2').value;
  const msg = document.getElementById('pw-msg');
  if(!actual || !nueva){ msg.style.color='#C0392B'; msg.textContent='Completá los campos.'; return; }
  if(nueva.length < 6){ msg.style.color='#C0392B'; msg.textContent='La nueva contraseña debe tener al menos 6 caracteres.'; return; }
  if(nueva !== nueva2){ msg.style.color='#C0392B'; msg.textContent='Las contraseñas nuevas no coinciden.'; return; }
  msg.style.color='var(--muted)'; msg.textContent='Guardando…';
  try{
    await apiCall('changePassword', { actual, nueva });
    msg.style.color='#2D9B6F'; msg.textContent='Contraseña actualizada correctamente.';
    ['pw-actual','pw-nueva','pw-nueva2'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  }catch(e){
    msg.style.color='#C0392B';
    msg.textContent = e.message==='clave_actual_incorrecta' ? 'La contraseña actual es incorrecta.' : ('Error: '+e.message);
  }
}

async function guardarMiClaveStaff(){
  const actual = document.getElementById('mc-actual').value;
  const nueva  = document.getElementById('mc-nueva').value;
  const nueva2 = document.getElementById('mc-nueva2').value;
  const msg    = document.getElementById('mc-msg');
  if(!actual || !nueva){ msg.style.color='var(--danger)'; msg.textContent='Completá todos los campos.'; return; }
  if(nueva.length < 6){ msg.style.color='var(--danger)'; msg.textContent='Mínimo 6 caracteres.'; return; }
  if(nueva !== nueva2){ msg.style.color='var(--danger)'; msg.textContent='Las contraseñas nuevas no coinciden.'; return; }
  msg.style.color='var(--muted)'; msg.textContent='Guardando…';
  try {
    await apiCall('updateStaffPassword', { username: state.session.username, actual, nueva });
    msg.style.color='var(--success)'; msg.textContent='✅ Contraseña actualizada correctamente.';
    setTimeout(closeModal, 1500);
  } catch(e){
    msg.style.color='var(--danger)';
    msg.textContent = e.message === 'clave_actual_incorrecta' ? 'La contraseña actual es incorrecta.' : 'Error: '+e.message;
  }
}

function togglePw(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  const mostrar = el.type === 'password';
  el.type = mostrar ? 'text' : 'password';
  btn.textContent = mostrar ? 'Ocultar' : 'Ver';
}

function renderDashboardTerapias(c){
  const fmt = n => '$' + Math.round(n||0).toLocaleString('es-CO');
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const yyyymm = d => { const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`; };
  const mesActual = yyyymm(hoy);

  const pacientes   = state.pacientesTerapia || [];
  const combos      = state.combos || [];
  const sesiones    = state.sesionesTerapia || [];

  const combosActivos    = combos.filter(c => c.estado === 'activo').length;
  const combosCompletados= combos.filter(c => c.estado !== 'activo').length;
  const sesionesEsteMes  = sesiones.filter(s => yyyymm(s.fecha||'') === mesActual).length;
  const ingresosCombos   = combos.reduce((s,c) => s+(Number(c.precio)||0), 0);

  const porTipo = {};
  combos.forEach(c => { porTipo[c.tipo] = (porTipo[c.tipo]||0)+1; });
  const maxTipo = Math.max(...Object.values(porTipo), 1);

  c.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button onclick="renderDashboard(document.getElementById('page-content'),'membresias')" style="padding:8px 20px;border-radius:20px;border:2px solid var(--plum);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;background:transparent;color:var(--plum)">💳 Membresías</button>
      <button onclick="renderDashboard(document.getElementById('page-content'),'terapias')" style="padding:8px 20px;border-radius:20px;border:2px solid var(--plum);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--plum);color:#fff">🐾 Terapias Físicas</button>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Pacientes</div>
        <div class="kpi-value">${pacientes.length}</div>
        <div class="kpi-sub">${combosActivos} con combo activo</div>
      </div>
      <div class="kpi-card" style="--kpi-accent:var(--success)">
        <div class="kpi-label">Combos activos</div>
        <div class="kpi-value" style="color:var(--success)">${combosActivos}</div>
        <div class="kpi-sub">${combosCompletados} completado${combosCompletados!==1?'s':''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Sesiones este mes</div>
        <div class="kpi-value">${sesionesEsteMes}</div>
        <div class="kpi-sub">${sesiones.length} total acumuladas</div>
      </div>
      <div class="kpi-card" style="background:linear-gradient(135deg,var(--plum),var(--plum-mid));color:#fff">
        <div class="kpi-label" style="color:rgba(255,255,255,.8)">Ingresos combos</div>
        <div style="font-family:'DM Serif Display',serif;font-size:2rem;font-weight:400;margin:6px 0">${fmt(ingresosCombos)}</div>
        <div style="font-size:.75rem;opacity:.7">Total acumulado</div>
      </div>
    </div>

    <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px">
      <div style="font-weight:600;margin-bottom:16px">Combos por tipo</div>
      ${Object.keys(porTipo).length === 0
        ? '<p style="color:var(--muted);text-align:center;padding:20px">Sin combos registrados</p>'
        : Object.entries(porTipo).map(([tipo, n]) => {
            const def = COMBOS_TERAPIA[tipo] || { label: tipo, icon: '🐾' };
            const pct = Math.round((n/maxTipo)*100);
            return `
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
                <div style="width:130px;font-size:.82rem;white-space:nowrap">${def.icon} ${def.label}</div>
                <div style="flex:1;background:var(--border);border-radius:4px;height:10px">
                  <div style="background:var(--plum-mid);height:10px;border-radius:4px;width:${pct}%"></div>
                </div>
                <div style="width:24px;text-align:right;font-size:.82rem;font-weight:600">${n}</div>
              </div>`;
          }).join('')}
    </div>

    <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px">
      <div style="font-weight:600;margin-bottom:16px">Últimas sesiones registradas</div>
      ${sesiones.length === 0
        ? '<p style="color:var(--muted);text-align:center;padding:20px">Sin sesiones registradas</p>'
        : sesiones.slice().reverse().slice(0,8).map(s => {
            const combo = combos.find(c => c.id === s.comboId) || {};
            const pac   = pacientes.find(p => p.id === combo.pacienteId) || {};
            const def   = COMBOS_TERAPIA[combo.tipo] || { icon:'🐾', label: combo.tipo||'—' };
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.83rem">
                <div style="display:flex;align-items:center;gap:10px">
                  <span>${def.icon}</span>
                  <div>
                    <div style="font-weight:500">${pac.nombre||'—'} · ${pac.mascota||'—'}</div>
                    <div style="color:var(--muted)">${def.label}</div>
                  </div>
                </div>
                <div style="text-align:right;color:var(--muted)">${s.fecha||'—'}</div>
              </div>`;
          }).join('')}
    </div>`;
}

async function renderSolicitudes(c){
  c.innerHTML = `<div style="color:var(--muted);padding:20px">Cargando solicitudes…</div>`;
  try {
    const r = await apiCall('getSolicitudes');
    state.solicitudes = r.solicitudes || [];
  } catch(e){
    c.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Error al cargar: ${e.message}</p></div>`;
    return;
  }

  const pendientes  = state.solicitudes.filter(s=>s.estado==='pendiente');
  const procesadas  = state.solicitudes.filter(s=>s.estado!=='pendiente');

  const tipoLabel = { editCliente:'Editar datos', editConsumo:'Corregir servicio', deleteCliente:'Eliminar cliente' };

  const renderFila = (s, acciones) => {
    const cliente = state.clientes.find(x=>x.id===s.clienteId);
    const datos = typeof s.datos === 'string' ? JSON.parse(s.datos||'{}') : (s.datos||{});
    return `<tr>
      <td style="font-size:.8rem">${formatDate(s.creadoEn)}</td>
      <td><span class="pill ${s.tipo==='deleteCliente'?'pill-expired':'pill-silver'}">${tipoLabel[s.tipo]||s.tipo}</span></td>
      <td style="font-weight:600">${cliente?.nombre||s.clienteId}</td>
      <td style="font-size:.8rem;color:var(--muted)">${s.solicitadoPor||'—'}</td>
      <td style="font-size:.8rem;color:var(--muted);max-width:200px">${datos.motivo||'—'}</td>
      <td>${acciones(s)}</td>
    </tr>`;
  };

  c.innerHTML = `
    <div class="table-card" style="margin-bottom:24px">
      <div class="table-header">
        <h2>⏳ Solicitudes pendientes · <span>${pendientes.length}</span></h2>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Cliente</th><th>Solicitado por</th><th>Motivo</th><th>Acción</th></tr></thead>
          <tbody>
            ${pendientes.length
              ? pendientes.map(s=>renderFila(s, s=>`
                  <div style="display:flex;gap:6px">
                    <button class="btn-icon" style="color:var(--success);border-color:var(--success)" onclick="aprobarSolicitud('${s.id}')">✅ Aprobar</button>
                    <button class="btn-icon danger" onclick="rechazarSolicitud('${s.id}')">❌ Rechazar</button>
                  </div>`)).join('')
              : `<tr><td colspan="6"><div class="empty-state" style="padding:32px"><div class="empty-icon">✅</div><p>No hay solicitudes pendientes</p></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h2>📁 Solicitudes procesadas · <span>${procesadas.length}</span></h2>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Cliente</th><th>Solicitado por</th><th>Motivo</th><th>Estado</th></tr></thead>
          <tbody>
            ${procesadas.length
              ? procesadas.map(s=>renderFila(s, s=>`
                  <span class="pill ${s.estado==='aprobada'?'pill-active':'pill-expired'}">
                    ${s.estado==='aprobada'?'✅ Aprobada':'❌ Rechazada'}
                  </span>`)).join('')
              : `<tr><td colspan="6"><div class="empty-state" style="padding:24px"><div class="empty-icon">📂</div><p>Sin historial</p></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

function filterHistorial(q){
  document.querySelectorAll('#historial-tbody tr').forEach(r=>{

  });
}

function openForgotPassword(){
  openModal('¿Olvidaste tu contraseña?', `

async function doForgotPassword(){
  const email = document.getElementById('fp-email').value.trim();
  const msg   = document.getElementById('fp-msg');
  if(!email){ msg.style.color='var(--danger)'; msg.textContent='Ingresá tu correo.'; return; }
  msg.style.color='var(--muted)'; msg.textContent='Enviando…';
  try {
    await apiCall('forgotPassword', { email });
    msg.style.color='var(--success)';
    msg.textContent='✅ Te enviamos el enlace a ese correo. Revisá tu bandeja.';
    document.querySelector('#modal-body .btn-save').disabled = true;
  } catch(e){
    msg.style.color='var(--danger)';
    msg.textContent = e.message === 'correo_no_encontrado'
      ? '❌ El correo electrónico no está registrado.'
      : 'Error: ' + e.message;
  }
}

function verPacienteTerapia(pacienteId){
  const p = state.pacientesTerapia.find(x => x.id === pacienteId);
  if(!p) return;
  const combos = state.combos.filter(c => c.pacienteId === pacienteId);

  const combosHtml = combos.length === 0
    ? '<p style="color:var(--muted);text-align:center;padding:20px">Sin combos registrados</p>'
    : combos.map(combo => {
        const def = COMBOS_TERAPIA[combo.tipo] || {};
        const sesiones = state.sesionesTerapia.filter(s => s.comboId === combo.id);
        const usadas = sesiones.length;
        const total = combo.totalSesiones || def.sesiones || 0;
        const pct = total > 0 ? Math.round(usadas/total*100) : 0;
        const activo = combo.estado === 'activo';
        return `
          <div style="background:var(--cream);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <div>
                <span style="font-size:1.1rem">${def.icon||'🐾'}</span>
                <strong style="margin-left:6px">${def.label||combo.tipo}</strong>
                <span style="margin-left:8px;font-size:.7rem;padding:2px 8px;border-radius:12px;background:${activo?'var(--success-lt)':'var(--border)'};color:${activo?'var(--success)':'var(--muted)'}">${activo?'Activo':'Completado'}</span>
              </div>
              <div style="display:flex;gap:6px">
                ${activo ? `<button class="btn-icon" onclick="openRegistrarSesion('${combo.id}')">＋ Sesión</button>` : ''}
                <button class="btn-icon" onclick="eliminarCombo('${combo.id}','${pacienteId}')" title="Eliminar combo">🗑</button>
              </div>
            </div>
            <div style="background:var(--border);border-radius:4px;height:6px;margin-bottom:6px">
              <div style="background:var(--plum-mid);height:6px;border-radius:4px;width:${pct}%"></div>
            </div>
            <div style="font-size:.78rem;color:var(--muted);margin-bottom:${sesiones.length?'10px':'0'}">${usadas} de ${total} sesiones · ${fmtCOP(combo.precio||0)}</div>
            ${sesiones.length > 0 ? `
              <div style="font-size:.8rem">
                ${sesiones.slice().reverse().map(s=>`
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
                    <span style="color:var(--muted);flex-shrink:0">${s.fecha||''}</span>
                    <span style="flex:1;margin:0 10px;color:var(--ink)">${s.nota||''}</span>
                    <button class="btn-icon danger" onclick="eliminarSesion('${s.id}','${combo.id}','${pacienteId}')" title="Eliminar sesión" style="padding:2px 6px;font-size:.75rem">🗑</button>
                  </div>`).join('')}
              </div>` : ''}
          </div>`;
      }).join('');

  openModal(p.nombre, `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;font-size:.85rem">
      <div><span style="color:var(--muted)">Mascota:</span> ${p.mascota||'—'}</div>
      <div><span style="color:var(--muted)">Especie:</span> ${p.especie||'—'}</div>
      <div><span style="color:var(--muted)">Teléfono:</span> ${p.telefono||'—'}</div>
      <div><span style="color:var(--muted)">Email:</span> ${p.email||'—'}</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <strong style="font-size:.9rem">Combos</strong>
      <button class="btn-icon" onclick="openNuevoCombo('${p.id}')">+ Combo</button>
    </div>
    ${combosHtml}
  `);
}

async function guardarPacienteTerapia(){
  const nombre  = document.getElementById('tp-nombre').value.trim();
  const cedula  = document.getElementById('tp-cedula').value.trim();
  const mascota = document.getElementById('tp-mascota').value.trim();
  const especie = document.getElementById('tp-especie').value;
  const telefono= document.getElementById('tp-tel').value.trim();
  const email   = document.getElementById('tp-email').value.trim();
  const comboTipo  = document.getElementById('tp-combo-tipo').value;
  const comboFecha = document.getElementById('tp-combo-fecha').value;
  if(!nombre || !mascota){ toast('Nombre y mascota son obligatorios','error'); return; }
  showLoading();
  try {
    const r = await apiCall('addPacienteTerapia', { nombre, cedula, mascota, especie, telefono, email });
    state.pacientesTerapia.push(r.paciente);
    if(comboTipo){
      const def = COMBOS_TERAPIA[comboTipo];
      const rc = await apiCall('addCombo', { pacienteId: r.paciente.id, tipo: comboTipo, fecha: comboFecha, totalSesiones: def.sesiones, precio: def.precio });
      state.combos.push(rc.combo);
    }
    closeModal();
    hideLoading();
    toast('✅ Paciente registrado' + (comboTipo ? ' con combo' : ''));
    renderPage('terapias');
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

function openNuevoCombo(pacienteId){

    `<option value="${k}">${v.icon} ${v.label} — ${v.sesiones} sesiones — ${fmtCOP(v.precio)}</option>`
  ).join('');
  openModal('Nuevo Combo', `
