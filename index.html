<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Center · Membresías</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --plum:      #4A1A6B;
  --plum-mid:  #6B2FA0;
  --plum-lt:   #9B59D0;
  --lavender:  #C9A8E8;
  --cream:     #FAF7FF;
  --white:     #FFFFFF;
  --ink:       #1A0A2E;
  --muted:     #7A6B8A;
  --border:    #E8DEFA;
  --gold:      #E8A020;
  --gold-lt:   #FFF0D0;
  --silver:    #7090B8;
  --silver-lt: #EAF0F8;
  --morada:    #9B59D0;
  --morada-lt: #F0E8FA;
  --success:   #2D9B6F;
  --success-lt:#E8FAF4;
  --danger:    #C0392B;
  --danger-lt: #FDE8E6;
  --warn:      #D4800A;
  --warn-lt:   #FFF3E0;
  --shadow-sm: 0 1px 4px rgba(74,26,107,0.08);
  --shadow-md: 0 4px 20px rgba(74,26,107,0.12);
  --shadow-lg: 0 12px 48px rgba(74,26,107,0.18);
  --radius:    14px;
  --radius-sm: 8px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--lavender);border-radius:3px}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  background:linear-gradient(135deg,#C9A8E8 0%,#B48DD6 50%,#9B6EC4 100%)}
.login-card{background:var(--white);border-radius:24px;padding:48px 40px;width:100%;max-width:400px;
  box-shadow:var(--shadow-lg);text-align:center;animation:fadeUp .5s ease}
.login-logo{height:72px;width:auto;margin:0 auto 20px;display:block}
.login-card h1{font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--plum);margin-bottom:4px}
.login-card p{color:var(--muted);font-size:.9rem;margin-bottom:32px}
.input-group{text-align:left;margin-bottom:16px}
.input-group label{display:block;font-size:.8rem;font-weight:600;color:var(--plum);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.input-group input{width:100%;border:2px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:.95rem;color:var(--ink);
  background:var(--cream);transition:.2s;outline:none}
.input-group input:focus{border-color:var(--plum-lt);background:var(--white)}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--plum),var(--plum-mid));
  color:var(--white);border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;
  font-size:1rem;font-weight:600;cursor:pointer;transition:.2s;letter-spacing:.3px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(74,26,107,.35)}
.btn-primary:active{transform:none}
.login-err{color:var(--danger);font-size:.85rem;margin-top:12px;min-height:20px}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:linear-gradient(90deg,var(--plum),var(--plum-mid));color:var(--white);
  padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(74,26,107,.3)}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{width:34px;height:34px;border-radius:6px;display:block}
.topbar-title{font-family:'DM Serif Display',serif;font-size:1.15rem;letter-spacing:.3px}
.topbar-subtitle{font-size:.75rem;opacity:.7}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-user{font-size:.82rem;opacity:.85}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:var(--white);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;
  font-family:'DM Sans',sans-serif;transition:.2s}
.btn-logout:hover{background:rgba(255,255,255,.25)}

/* ── NAV ── */
.nav-tabs{background:var(--white);border-bottom:2px solid var(--border);
  padding:0 24px;display:flex;gap:0;overflow-x:auto;flex-shrink:0}
.nav-tab{padding:14px 20px;font-size:.85rem;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
  white-space:nowrap;transition:.2s;display:flex;align-items:center;gap:6px}
.nav-tab:hover{color:var(--plum-mid)}
.nav-tab.active{color:var(--plum);border-bottom-color:var(--plum);font-weight:600}
.nav-tab .tab-icon{font-size:1rem}

/* ── CONTENT ── */
.content{flex:1;padding:28px 24px;max-width:1300px;margin:0 auto;width:100%}

/* ── CARDS / KPIs ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.kpi-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);
  border:1px solid var(--border);transition:.2s}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-label{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--plum)}
.kpi-sub{font-size:.78rem;color:var(--muted);margin-top:4px}
.kpi-card.gold .kpi-value{color:var(--gold)}
.kpi-card.silver .kpi-value{color:var(--silver)}
.kpi-card.morada .kpi-value{color:var(--morada)}

/* ── TABLE ── */
.table-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  border:1px solid var(--border);overflow:hidden}
.table-header{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.table-header h2{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--ink)}
.table-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-box{border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;
  font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--ink);background:var(--cream);
  outline:none;transition:.2s;width:220px}
.search-box:focus{border-color:var(--plum-lt)}
.filter-select{border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;
  font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--ink);background:var(--cream);
  outline:none;cursor:pointer;transition:.2s}
.filter-select:focus{border-color:var(--plum-lt)}
.btn-add{background:var(--plum);color:var(--white);border:none;border-radius:var(--radius-sm);
  padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s;white-space:nowrap}
.btn-add:hover{background:var(--plum-mid);box-shadow:0 4px 12px rgba(74,26,107,.3)}

table{width:100%;border-collapse:collapse}
thead tr{background:var(--cream)}
th{padding:11px 16px;text-align:left;font-size:.75rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border)}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:.88rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.15s}
tbody tr:hover{background:var(--cream)}

/* ── PILLS ── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:.75rem;font-weight:600;letter-spacing:.3px}
.pill-gold{background:var(--gold-lt);color:#8B5A00}
.pill-silver{background:var(--silver-lt);color:#3A5A7A}
.pill-morada{background:var(--morada-lt);color:var(--plum)}
.pill-active{background:var(--success-lt);color:var(--success)}
.pill-expiring{background:var(--warn-lt);color:var(--warn)}
.pill-expired{background:var(--danger-lt);color:var(--danger)}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── ACTION BTNS ── */
.btn-icon{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;
  cursor:pointer;font-size:.82rem;color:var(--muted);transition:.2s;display:inline-flex;align-items:center;gap:4px}
.btn-icon:hover{border-color:var(--plum-lt);color:var(--plum);background:var(--morada-lt)}
.btn-icon.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-lt)}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,10,46,.55);z-index:200;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex;animation:fadeIn .2s ease}
.modal{background:var(--white);border-radius:20px;width:100%;max-width:540px;
  max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:fadeUp .25s ease}
.modal-head{padding:24px 24px 0;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-family:'DM Serif Display',serif;font-size:1.35rem;color:var(--ink)}
.modal-close{background:none;border:none;font-size:1.4rem;color:var(--muted);cursor:pointer;
  width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{background:var(--border);color:var(--ink)}
.modal-body{padding:20px 24px 28px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.78rem;font-weight:600;color:var(--plum);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;border:2px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:.9rem;
  color:var(--ink);background:var(--cream);outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:var(--plum-lt);background:var(--white)}
.form-group textarea{resize:vertical;min-height:70px}
.form-hint{font-size:.75rem;color:var(--muted);margin-top:5px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
.btn-cancel{background:var(--cream);border:2px solid var(--border);color:var(--muted);
  padding:10px 20px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-cancel:hover{border-color:var(--muted)}
.btn-save{background:linear-gradient(135deg,var(--plum),var(--plum-mid));color:var(--white);
  border:none;padding:10px 24px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-save:hover{box-shadow:0 4px 14px rgba(74,26,107,.35)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}

/* ── SERVICE MODAL ── */
.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.service-btn{border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px;
  background:var(--cream);cursor:pointer;text-align:left;transition:.2s;font-family:'DM Sans',sans-serif}
.service-btn:hover{border-color:var(--plum-lt);background:var(--morada-lt)}
.service-btn.selected{border-color:var(--plum);background:var(--morada-lt)}
.service-btn .svc-name{font-size:.88rem;font-weight:600;color:var(--ink)}
.service-btn .svc-left{font-size:.75rem;color:var(--muted);margin-top:2px}
.service-btn .svc-left.none{color:var(--danger)}
.service-btn.depleted{opacity:.5;cursor:not-allowed}

/* ── CLIENT DETAIL ── */
.detail-header{display:flex;gap:20px;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap}
.detail-avatar{width:64px;height:64px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  background:linear-gradient(135deg,var(--plum),var(--plum-lt))}
.detail-info h2{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--ink)}
.detail-info p{color:var(--muted);font-size:.88rem;margin-top:2px}
.detail-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.svc-card{background:var(--white);border:2px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.svc-card .svc-icon{font-size:1.6rem;margin-bottom:8px}
.svc-card .svc-title{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.svc-card .svc-count{font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--plum)}
.svc-card .svc-total{font-size:.75rem;color:var(--muted)}
.svc-card.depleted{border-color:var(--danger);background:var(--danger-lt)}
.svc-card.depleted .svc-count{color:var(--danger)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--plum);transition:.4s}
.progress-fill.warn{background:var(--warn)}
.progress-fill.danger{background:var(--danger)}

/* ── HISTORY TABLE ── */
.section-title{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--ink);margin-bottom:12px}

/* ── VENCIMIENTOS ── */
.alert-card{border-radius:var(--radius);padding:16px 20px;margin-bottom:12px;
  display:flex;align-items:center;gap:16px;border:1px solid}
.alert-card.expiring{background:var(--warn-lt);border-color:#F0C060}
.alert-card.expired{background:var(--danger-lt);border-color:#E8A0A0}
.alert-icon{font-size:1.4rem;flex-shrink:0}
.alert-name{font-weight:600;color:var(--ink);font-size:.95rem}
.alert-sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.alert-days{font-weight:700;font-size:.9rem}
.alert-days.expiring{color:var(--warn)}
.alert-days.expired{color:var(--danger)}

/* ── CHARTS ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
@media(max-width:700px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--white);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.chart-card h3{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--ink);margin-bottom:16px}
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{font-size:.8rem;color:var(--muted);width:90px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:22px;background:var(--border);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;
  padding-right:8px;font-size:.72rem;font-weight:700;color:var(--white);transition:.6s}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold),#F0B040)}
.bar-fill.silver{background:linear-gradient(90deg,var(--silver),#90A8C8)}
.bar-fill.morada{background:linear-gradient(90deg,var(--morada),var(--plum-lt))}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--ink);color:var(--white);padding:12px 18px;border-radius:10px;
  font-size:.85rem;box-shadow:var(--shadow-lg);animation:slideIn .3s ease;
  display:flex;align-items:center;gap:8px;max-width:320px}
.toast-item.success{background:var(--success)}
.toast-item.error{background:var(--danger)}
.toast-item.warn{background:var(--warn)}

/* ── SYNC INDICATOR ── */
.sync-bar{background:var(--morada-lt);border-bottom:1px solid var(--border);
  padding:6px 24px;font-size:.78rem;color:var(--plum);display:none;align-items:center;gap:8px}
.sync-bar.show{display:flex}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--plum-lt);animation:pulse 1s infinite}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:.95rem}

/* ── TABS WITHIN PAGES ── */
.page-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px}
.page-tab{padding:10px 18px;font-size:.85rem;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.page-tab.active{color:var(--plum);border-bottom-color:var(--plum);font-weight:600}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .content{padding:16px 12px}
  .form-row{grid-template-columns:1fr}
  .topbar-subtitle{display:none}
  .service-grid{grid-template-columns:1fr}
  .charts-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
}

/* ── CREDENTIAL BOX ── */
.cred-box{background:var(--plum);color:var(--white);border-radius:12px;padding:16px 20px;margin-top:16px}
.cred-box h4{font-size:.8rem;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.cred-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cred-label{font-size:.82rem;opacity:.8}
.cred-value{font-size:.9rem;font-weight:700;font-family:monospace;background:rgba(255,255,255,.15);
  padding:3px 10px;border-radius:4px}

/* ── PLAN INFO BOX ── */
.plan-info-box{border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.85rem}
.plan-info-box.gold{background:var(--gold-lt);border:1px solid #E8C070;color:#6A4000}
.plan-info-box.silver{background:var(--silver-lt);border:1px solid #90A8C8;color:#2A4A6A}
.plan-info-box.morada{background:var(--morada-lt);border:1px solid var(--lavender);color:var(--plum)}

/* loading overlay */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.8);
  z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--plum);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ── LOGIN ── -->

<script>
// ════════════════════════════════════════════
// CONFIG — cambia estas dos líneas
// ════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMEXq-UxK1IGxQCi8NldF7IRHjlj5es5rNaE_WeIXJUqNauphG-jJ8Q8tW7mV64jZZ/exec';
const API_TOKEN  = 'animalcenter2024secret';

// ════════════════════════════════════════════

      ecografias:   {label:'Ecografía',              icon:'🔬',  total:1},
      laboratorio:  {label:'Exámenes de sangre',     icon:'🧪',  total:6, cantidadVariable:true},
      vacunas:      {label:'Vacuna',                 icon:'💉',  total:1},

  Morada: {

};

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
let state = {
  session: null,     // {username, rol, nombre}
  clientes: [],      // loaded from Sheets
  consumos: [],
  usuarios: []
};

// ════════════════════════════════════════════
// AUTH (local — usuarios admin en código, 
// clientes se cargan de Sheets)
// ════════════════════════════════════════════
const STAFF_USERS = [
  {username:'admin',   pass:'admin2024',    rol:'admin',    nombre:'Administrador'},
  {username:'personal',pass:'staff2024',   rol:'personal', nombre:'Personal'},
];

function doLogin(){
  const u = document.getElementById('login-user').value.trim().toLowerCase();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = '';

  // Staff
  const staff = STAFF_USERS.find(x=>x.username===u && x.pass===p);
  if(staff){
    state.session = staff;
    startApp();
    return;
  }

  // Cliente — busca en clientes cargados
  // (solo si ya se cargaron; si no, carga primero)
  const tryClientLogin = () => {
    const c = state.clientes.find(x=>
      x.usuario && x.usuario.toLowerCase()===u && x.password===p
    );
    if(c){
      state.session = {username:u, rol:'cliente', nombre:c.nombre, clienteId:c.id};
      startApp();
    } else {
      err.textContent = 'Usuario o contraseña incorrectos.';
    }
  };

  if(state.clientes.length > 0){
    tryClientLogin();
  } else {
    err.textContent = 'Verificando…';
    loadFromSheets().then(()=>tryClientLogin()).catch(()=>{
      err.textContent = 'Error de conexión. Verifica la configuración.';
    });
  }
}

document.getElementById('login-pass').addEventListener('keydown', e=>{
  if(e.key==='Enter') doLogin();
});

function doLogout(){
  state.session = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}

// ════════════════════════════════════════════
// GOOGLE SHEETS — API
// ════════════════════════════════════════════
async function apiCall(action, data={}){
  const body = JSON.stringify({action, token: API_TOKEN, ...data});
  // Usamos fetch normal — el Apps Script nuevo tiene headers CORS correctos
  const res = await fetch(SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'}, // text/plain evita preflight
    body
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Error desconocido');
  return json;
}

async function loadFromSheets(){
  showSync('Cargando datos desde Google Sheets…');
  try {
    const r = await apiCall('getAll');
    state.clientes = r.clientes || [];
    state.consumos = r.consumos || [];
    state.usuarios = r.usuarios || [];
    hideSync();
    return true;
  } catch(e){
    hideSync();
    // Si el script no está configurado, usamos datos vacíos
    if(SCRIPT_URL.includes('TU_APPS_SCRIPT')){
      toast('⚠️ Apps Script no configurado — modo demo local','warn');
    } else {
      toast('Error al cargar Sheets: '+e.message,'error');
    }
    return false;
  }
}

// ════════════════════════════════════════════
// APP INIT
// ════════════════════════════════════════════
async function startApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  document.getElementById('topbar-user').textContent = state.session.nombre;

  await loadFromSheets();
  buildNav();
  renderPage('clientes');
}

function buildNav(){
  const rol = state.session.rol;
  const tabs = [];
  if(rol==='cliente'){
    tabs.push({id:'mi-membresia',label:'Mi Membresía',icon:'💳'});
  } else {
    tabs.push({id:'clientes',label:'Clientes',icon:'👥'});
    tabs.push({id:'vencimientos',label:'Vencimientos',icon:'⏰'});
    tabs.push({id:'dashboard',label:'Dashboard',icon:'📊'});
    if(rol==='admin'){
      tabs.push({id:'usuarios',label:'Usuarios',icon:'🔐'});
    }
  }
  const nav = document.getElementById('nav-tabs');
  nav.innerHTML = tabs.map(t=>`
    <div class="nav-tab" id="tab-${t.id}" onclick="renderPage('${t.id}')">
      <span class="tab-icon">${t.icon}</span>${t.label}
    </div>`).join('');
}

function setActiveTab(id){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  const el = document.getElementById('tab-'+id);
  if(el) el.classList.add('active');
}

// ════════════════════════════════════════════
// ROUTING
// ════════════════════════════════════════════
function renderPage(page){
  setActiveTab(page);
  const c = document.getElementById('page-content');
  switch(page){
    case 'clientes':      c.innerHTML = ''; renderClientes(c); break;
    case 'vencimientos':  c.innerHTML = ''; renderVencimientos(c); break;
    case 'dashboard':     c.innerHTML = ''; renderDashboard(c); break;
    case 'usuarios':      c.innerHTML = ''; renderUsuarios(c); break;
    case 'mi-membresia':  c.innerHTML = ''; renderMiMembresia(c); break;
    default: c.innerHTML = '<p>Página no encontrada</p>';
  }
}

// ════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════
function statusCliente(c){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const fin = new Date(c.fechaFin);
  const diff = Math.round((fin-hoy)/(1000*60*60*24));
  if(diff < 0)  return {label:'Vencida',   pill:'pill-expired',  days:diff};
  if(diff <= 30) return {label:'Por vencer',pill:'pill-expiring', days:diff};
  return               {label:'Activa',    pill:'pill-active',   days:diff};
}

function consumosPorCliente(clienteId){
  return state.consumos.filter(c=>c.clienteId===clienteId);
}

function serviciosUsados(clienteId){
  const usados = {};
  consumosPorCliente(clienteId).forEach(c=>{
    // Para laboratorio sumamos la cantidad; para el resto cuenta como 1
    const plan = state.clientes.find(x=>x.id===clienteId)?.plan;
    const svcDef = plan ? PLANES[plan]?.servicios[c.servicio] : null;
    const inc = (svcDef?.cantidadVariable && c.cantidad) ? Number(c.cantidad) : 1;
    usados[c.servicio] = (usados[c.servicio]||0) + inc;
  });
  return usados;
}

function serviciosRestantes(clienteId, plan){
  const p = PLANES[plan];
  if(!p) return {};
  const usados = serviciosUsados(clienteId);
  const restantes = {};
  Object.entries(p.servicios).forEach(([k,v])=>{
    restantes[k] = Math.max(0, v.total - (usados[k]||0));
  });
  return restantes;
}

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function genCredenciales(nombre, cedula, mascota){
  const firstName = nombre.trim().split(' ')[0].toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const lastDigits = cedula.toString().slice(-4);
  const petName = mascota.trim().split(' ')[0].toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return {
    usuario: firstName + lastDigits,
    password: 'teamo' + petName
  };
}

function formatDate(d){
  if(!d) return '—';
  // Parse YYYY-MM-DD as local date to avoid UTC midnight offset bug
  if(typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)){
    const [y,mo,day] = d.split('-').map(Number);
    const dt = new Date(y, mo-1, day);
    return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
  }
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
}

function addDays(date, days){
  const d = new Date(date);
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}

function showSync(msg){ 
  document.getElementById('sync-msg').textContent=msg;
  document.getElementById('sync-bar').classList.add('show');
}
function hideSync(){ document.getElementById('sync-bar').classList.remove('show'); }
function showLoading(){ document.getElementById('loading-overlay').classList.add('show'); }
function hideLoading(){ document.getElementById('loading-overlay').classList.remove('show'); }

function toast(msg, type='success', dur=3500){
  const t = document.createElement('div');
  t.className = 'toast-item '+type;
  t.innerHTML = msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(()=>t.remove(), dur);
}

function closeModal(e){
  if(e && e.target!==document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}
function openModal(title, body){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
}

function pillPlan(plan){
  const p = PLANES[plan];
  if(!p) return `<span class="pill">${plan}</span>`;
  return `<span class="pill ${p.pill}">${p.icon} ${p.label}</span>`;
}

async function guardarCliente(){
  const nombre  = document.getElementById('nc-nombre').value.trim();
  const cedula  = document.getElementById('nc-cedula').value.trim();
  const mascota = document.getElementById('nc-mascota').value.trim();
  const especie = document.getElementById('nc-especie').value;
  const plan    = document.getElementById('nc-plan').value;
  const inicio  = document.getElementById('nc-inicio').value;
  const tel     = document.getElementById('nc-tel').value.trim();
  const email   = document.getElementById('nc-email').value.trim();

  if(!nombre||!cedula||!mascota||!inicio||!email){
    toast('Completa los campos obligatorios (*)','error'); return;
  }

  const creds = genCredenciales(nombre, cedula, mascota);
  const cliente = {
    id: genId(),
    nombre, cedula, mascota, especie, plan, tel, email,
    fechaInicio: inicio,
    fechaFin: addDays(inicio, 365),
    usuario: creds.usuario,
    password: creds.password,
    creadoEn: new Date().toISOString()
  };

  showLoading();
  try {
    await apiCall('addCliente', {cliente});
    state.clientes.push(cliente);
    closeModal();
    hideLoading();
    // Mostrar credenciales
    openModal('✅ Cliente registrado', `
      <p style="margin-bottom:12px">El cliente fue registrado exitosamente con 365 días de membresía.</p>
      <div class="cred-box">

        <div class="cred-row"><span class="cred-label">Correo</span><span class="cred-value" style="font-size:.8rem">${email}</span></div>
      </div>
      <p style="font-size:.78rem;color:var(--muted);margin-top:12px">Las notificaciones de consumo se enviarán automáticamente a este correo.</p>

    `);
    toast('✅ Cliente guardado en Google Sheets');
    renderClientTable();
  } catch(e){

  }
}

function verCliente(id){
  const c = state.clientes.find(x=>x.id===id);
  if(!c) return;
  const plan = PLANES[c.plan];
  const st   = statusCliente(c);
  const usados = serviciosUsados(id);
  const consumos = consumosPorCliente(id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const esMorada = plan.soloDescuentos;

  const svcsHTML = esMorada
    ? `<div style="background:var(--morada-lt);border:1px solid var(--lavender);border-radius:12px;
          padding:20px 24px;display:flex;align-items:center;gap:14px;margin-bottom:4px">
        <div style="font-size:2rem">💜</div>
        <div>
          <div style="font-weight:700;color:var(--plum);margin-bottom:4px">Plan Morada · Membresía de descuentos</div>
          <div style="font-size:.85rem;color:var(--muted)">Este plan incluye descuentos especiales en productos y servicios de Animal Center. No incluye servicios prepagados.</div>
        </div>
      </div>`
    : Object.entries(plan.servicios).map(([k,v])=>{
        const usado = usados[k]||0;
        const resto = Math.max(0, v.total-usado);
        const pct   = v.total ? Math.round((resto/v.total)*100) : 0;
        const depleted = resto===0 && v.total>0;
        const fillClass = pct<=25?'danger':pct<=60?'warn':'';
        return `<div class="svc-card ${depleted?'depleted':''}">
          <div class="svc-icon">${v.icon}</div>
          <div class="svc-title">${v.label}</div>
          <div class="svc-count">${resto}</div>
          <div class="svc-total">de ${v.total} restantes</div>
          <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
        </div>`;
      }).join('');

  const histHTML = consumos.length ? `
    <table>
      <thead><tr><th>Fecha</th><th>Servicio</th><th>Notas</th><th>Registrado por</th></tr></thead>
      <tbody>${consumos.map(co=>`
        <tr>
          <td style="font-size:.82rem">${formatDate(co.fecha)}</td>
          <td>${plan.servicios[co.servicio]?.icon||''} ${plan.servicios[co.servicio]?.label||co.servicio}</td>
          <td style="font-size:.82rem;color:var(--muted)">${co.notas||'—'}</td>
          <td style="font-size:.78rem;color:var(--muted)">${co.registradoPor||'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>` : `<div class="empty-state" style="padding:24px"><div class="empty-icon">📋</div><p>Sin consumos registrados</p></div>`;

  openModal(`🐾 ${c.nombre}`, `
    <div class="detail-header">
      <div class="detail-avatar">🐾</div>
      <div class="detail-info">
        <h2>${c.nombre}</h2>
        <p>${c.especie||'Mascota'}: <strong>${c.mascota}</strong> · CC: ${c.cedula}</p>
        ${c.tel?`<p>📞 ${c.tel}</p>`:''}
        <div class="detail-meta">
          ${pillPlan(c.plan)}
          <span class="pill ${st.pill}"><span class="pill-dot"></span>${st.label} · ${
            st.days<0?'venció hace '+Math.abs(st.days)+' días':st.days+' días restantes'
          }</span>
        </div>
        <p style="font-size:.78rem;color:var(--muted);margin-top:6px">
          ${formatDate(c.fechaInicio)} → ${formatDate(c.fechaFin)}
        </p>
      </div>
    </div>
    <div class="section-title">${esMorada ? 'Beneficios del plan' : 'Servicios incluidos'}</div>
    <div class="${esMorada ? '' : 'services-grid'}">${svcsHTML}</div>
    ${!esMorada ? `<div class="section-title">Historial de consumos</div>
    <div class="table-card">${histHTML}</div>` : ''}
    ${state.session.rol!=='cliente'?`
    <div class="modal-footer" style="margin-top:16px">
      <button class="btn-cancel" onclick="closeModal()">Cerrar</button>
      ${!esMorada?`<button class="btn-save" onclick="closeModal();openRegistrarConsumo('${c.id}')">＋ Registrar servicio</button>`:''}
    </div>`:`
    <div class="modal-footer" style="margin-top:16px">
      <button class="btn-save" onclick="closeModal()">Cerrar</button>
    </div>`}
  `);
}

function openRegistrarConsumo(clienteId){

  const plan = PLANES[c.plan];
  const restantes = serviciosRestantes(clienteId, c.plan);

  const btns = Object.entries(plan.servicios).map(([k,v])=>{
    const r = restantes[k];
    const depleted = v.total>0 && r===0;
    const noIncluded = v.total===0;
    return `<button class="service-btn ${depleted||noIncluded?'depleted':''}" 
      id="svc-btn-${k}"
      ${depleted||noIncluded?'disabled':''}
      onclick="toggleSvc('${k}',${depleted||noIncluded},${!!v.cantidadVariable},${r||0})">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="svc-check" id="svc-check-${k}" style="width:18px;height:18px;border-radius:4px;

          flex-shrink:0;font-size:.7rem;background:var(--white)"></span>
        <div>
          <div class="svc-name">${v.icon} ${v.label}${v.cantidadVariable?' <span style="font-size:.7rem;background:var(--plum);color:#fff;padding:1px 6px;border-radius:8px;margin-left:4px">cantidad variable</span>':''}</div>
          <div class="svc-left ${noIncluded?'none':depleted?'none':''}">${
            noIncluded?'No incluido en este plan':
            depleted?'Sin usos disponibles':
            `${r} de ${v.total} restantes`
          }</div>
        </div>
      </div>
    </button>`;
  }).join('');

  openModal(`Registrar servicios — ${c.nombre}`, `
    <p style="color:var(--muted);margin-bottom:16px;font-size:.88rem">
      ${pillPlan(c.plan)} · ${c.mascota} · Puedes seleccionar varios servicios a la vez
    </p>
    <div class="form-group">
      <label>Selecciona los servicios <span id="svc-count-label" style="color:var(--plum-mid);font-size:.8rem"></span></label>
      <div class="service-grid">${btns}</div>
    </div>
    <div id="lab-cantidad-box" style="display:none;margin-bottom:16px">
      <div style="background:var(--morada-lt);border:1px solid var(--lavender);border-radius:10px;padding:14px 16px">
        <label style="display:block;font-size:.78rem;font-weight:700;color:var(--plum);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">
          🧪 ¿Cuántos exámenes de sangre se realizaron?
        </label>
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="ajustarLab(-1)" style="width:34px;height:34px;border-radius:8px;border:2px solid var(--plum-lt);background:var(--white);font-size:1.2rem;cursor:pointer;color:var(--plum);font-weight:700;display:flex;align-items:center;justify-content:center">−</button>
          <input type="number" id="lab-cantidad" min="1" max="10" value="1"
            style="width:64px;text-align:center;border:2px solid var(--plum-lt);border-radius:8px;
            padding:6px;font-size:1.1rem;font-weight:700;color:var(--plum);font-family:'DM Sans',sans-serif"
            oninput="validarLab()">
          <button onclick="ajustarLab(1)" style="width:34px;height:34px;border-radius:8px;border:2px solid var(--plum-lt);background:var(--white);font-size:1.2rem;cursor:pointer;color:var(--plum);font-weight:700;display:flex;align-items:center;justify-content:center">+</button>
          <span id="lab-restantes-info" style="font-size:.82rem;color:var(--muted);margin-left:4px"></span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Fecha del servicio</label>

      <label>Notas (opcional)</label>
      <textarea id="svc-notas" placeholder="Observaciones, medicamentos, etc."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" id="btn-guardar-svc" onclick="guardarConsumo('${clienteId}')" disabled>
        Guardar <span id="btn-svc-label">servicios</span>
      </button>
    </div>
  `);
  window._svcSeleccionados = new Set();
  window._labMaxRestantes = 0;
}

function ajustarLab(delta){
  const inp = document.getElementById('lab-cantidad');
  if(!inp) return;
  const max = window._labMaxRestantes || 10;
  inp.value = Math.min(max, Math.max(1, (parseInt(inp.value)||1) + delta));
  validarLab();
}

function validarLab(){
  const inp = document.getElementById('lab-cantidad');
  const max = window._labMaxRestantes || 10;
  if(!inp) return;
  let v = parseInt(inp.value)||1;
  if(v < 1) v = 1;
  if(v > max) v = max;
  inp.value = v;
  const info = document.getElementById('lab-restantes-info');
  if(info) info.textContent = `máx. disponibles: ${max}`;
}

function toggleSvc(k, disabled, esVariable, restantes){
  if(disabled) return;
  const sel = window._svcSeleccionados;
  const check = document.getElementById('svc-check-'+k);
  const btn   = document.getElementById('svc-btn-'+k);
  if(sel.has(k)){
    sel.delete(k);
    btn.classList.remove('selected');
    check.textContent='';
    check.style.background='var(--white)';
    check.style.borderColor='var(--border)';
  } else {
    sel.add(k);
    btn.classList.add('selected');
    check.textContent='✓';
    check.style.background='var(--plum)';
    check.style.borderColor='var(--plum)';
    check.style.color='white';
  }
  // Mostrar/ocultar campo de cantidad para laboratorio
  const labBox = document.getElementById('lab-cantidad-box');
  if(labBox){
    const labSeleccionado = sel.has('laboratorio');
    labBox.style.display = labSeleccionado ? 'block' : 'none';
    if(labSeleccionado && esVariable){
      window._labMaxRestantes = restantes;
      const inp = document.getElementById('lab-cantidad');
      if(inp){ inp.max = restantes; inp.value = 1; }
      validarLab();
    }
  }
  const n = sel.size;
  document.getElementById('btn-guardar-svc').disabled = n===0;
  document.getElementById('svc-count-label').textContent = n>0?`(${n} seleccionado${n>1?'s':''})` : '';
  document.getElementById('btn-svc-label').textContent = n>1?`${n} servicios`:'servicio';
}

async function guardarConsumo(clienteId){
  const svcs  = Array.from(window._svcSeleccionados||[]);
  const fecha = document.getElementById('svc-fecha').value;
  const notas = document.getElementById('svc-notas').value.trim();
  if(!svcs.length){ toast('Selecciona al menos un servicio','error'); return; }

  const cliente = state.clientes.find(x=>x.id===clienteId);
  const plan    = PLANES[cliente?.plan];

  const nuevos = svcs.map(svc=>{
    const svcDef = plan?.servicios[svc];
    // Para laboratorio, leer la cantidad digitada
    const cantidad = (svcDef?.cantidadVariable && svcs.includes('laboratorio') && svc==='laboratorio')
      ? (parseInt(document.getElementById('lab-cantidad')?.value)||1)
      : 1;
    return {
      id: genId(), clienteId, servicio: svc, fecha,
      cantidad, notas,
      registradoPor: state.session.nombre,
      creadoEn: new Date().toISOString()
    };
  });

  showLoading();
  try {
    await Promise.all(nuevos.map(co=>apiCall('addConsumo',{consumo:co, notificarEmail:true})));
    nuevos.forEach(co=>state.consumos.push(co));
    closeModal(); hideLoading();
    const labNuevo = nuevos.find(c=>c.servicio==='laboratorio');
    const labMsg   = labNuevo && labNuevo.cantidad>1 ? ` (${labNuevo.cantidad} exámenes de sangre)` : '';
    toast(`✅ ${svcs.length} servicio${svcs.length>1?'s':''} registrado${svcs.length>1?'s':''}${labMsg} · Notificación enviada`);
    renderClientTable();
  } catch(e){
    hideLoading();
    toast('Error: '+e.message,'error');
  }
}

// ════════════════════════════════════════════
// ELIMINAR CLIENTE
// ════════════════════════════════════════════
function eliminarCliente(id){
  const c = state.clientes.find(x=>x.id===id);
  if(!c) return;
  openModal('⚠️ Eliminar cliente', `
    <p>¿Seguro que quieres eliminar a <strong>${c.nombre}</strong>? Esta acción no se puede deshacer.</p>
    <div class="modal-footer" style="margin-top:20px">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" style="background:var(--danger)" onclick="confirmarEliminar('${id}')">Sí, eliminar</button>
    </div>
  `);
}

async function confirmarEliminar(id){
  showLoading();
  try {
    await apiCall('deleteCliente',{clienteId:id});
    state.clientes = state.clientes.filter(c=>c.id!==id);
    state.consumos = state.consumos.filter(c=>c.clienteId!==id);
    closeModal(); hideLoading();
    toast('🗑 Cliente eliminado');
    renderClientTable();
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

// ════════════════════════════════════════════
// PAGE: VENCIMIENTOS
// ════════════════════════════════════════════
function renderVencimientos(c){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const vencidos = state.clientes
    .map(cl=>({...cl, st:statusCliente(cl)}))
    .filter(cl=>cl.st.label!=='Activa')
    .sort((a,b)=>a.st.days-b.st.days);

  const expiring30 = vencidos.filter(c=>c.st.days>=0);
  const expired    = vencidos.filter(c=>c.st.days<0);

  c.innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);max-width:480px;margin-bottom:28px">
      <div class="kpi-card"><div class="kpi-label">Total activas</div>
        <div class="kpi-value">${state.clientes.filter(cl=>statusCliente(cl).label==='Activa').length}</div></div>
      <div class="kpi-card"><div class="kpi-label">Por vencer (30d)</div>
        <div class="kpi-value" style="color:var(--warn)">${expiring30.length}</div></div>
      <div class="kpi-card"><div class="kpi-label">Vencidas</div>
        <div class="kpi-value" style="color:var(--danger)">${expired.length}</div></div>
    </div>

    ${expiring30.length?`<div class="section-title" style="margin-bottom:12px">⚠️ Por vencer (próximos 30 días)</div>
    ${expiring30.map(cl=>`
      <div class="alert-card expiring">
        <div class="alert-icon">⏰</div>
        <div style="flex:1">
          <div class="alert-name">${cl.nombre} · ${cl.mascota}</div>
          <div class="alert-sub">${pillPlan(cl.plan)} · Vence: ${formatDate(cl.fechaFin)}</div>
        </div>
        <div class="alert-days expiring">${cl.st.days === 0 ? 'Hoy' : 'en '+cl.st.days+' días'}</div>
        <button class="btn-icon" onclick="verCliente('${cl.id}')">Ver</button>
      </div>`).join('')}`:''}

    ${expired.length?`<div class="section-title" style="margin:20px 0 12px">🔴 Membresías vencidas</div>
    ${expired.map(cl=>`
      <div class="alert-card expired">
        <div class="alert-icon">❌</div>
        <div style="flex:1">
          <div class="alert-name">${cl.nombre} · ${cl.mascota}</div>
          <div class="alert-sub">${pillPlan(cl.plan)} · Venció: ${formatDate(cl.fechaFin)}</div>
        </div>
        <div class="alert-days expired">hace ${Math.abs(cl.st.days)} días</div>
        <button class="btn-icon" onclick="verCliente('${cl.id}')">Ver</button>
      </div>`).join('')}`:''}

    ${!vencidos.length?`<div class="empty-state" style="padding:80px 20px">
      <div class="empty-icon">✅</div>
      <p>¡Todas las membresías están activas y al día!</p>
    </div>`:''}
  `;
}

// ════════════════════════════════════════════
// PAGE: DASHBOARD
// ════════════════════════════════════════════
function renderDashboard(c){
  const total = state.clientes.length;
  const byPlan = {Gold:0,Silver:0,Morada:0};
  const byStatus = {Activa:0,'Por vencer':0,Vencida:0};
  const svcCount = {};

  state.clientes.forEach(cl=>{
    byPlan[cl.plan] = (byPlan[cl.plan]||0)+1;
    const st = statusCliente(cl).label;
    byStatus[st] = (byStatus[st]||0)+1;
  });
  state.consumos.forEach(co=>{
    svcCount[co.servicio] = (svcCount[co.servicio]||0)+1;
  });

  const maxPlan = Math.max(...Object.values(byPlan),1);
  const svcEntries = Object.entries(svcCount).sort((a,b)=>b[1]-a[1]);
  const maxSvc = svcEntries.length ? svcEntries[0][1] : 1;
  const allSvcs = {consultas:'🩺 Consultas',ecografias:'🔬 Ecografías',
    laboratorio:'🧪 Laboratorio',vacunas:'💉 Vacunas',rayosX:'☢️ Rayos X'};

  c.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Total clientes</div>
        <div class="kpi-value">${total}</div></div>
      <div class="kpi-card gold"><div class="kpi-label">Plan Gold</div>
        <div class="kpi-value">${byPlan.Gold}</div></div>
      <div class="kpi-card silver"><div class="kpi-label">Plan Silver</div>
        <div class="kpi-value">${byPlan.Silver}</div></div>
      <div class="kpi-card morada"><div class="kpi-label">Plan Morada</div>
        <div class="kpi-value">${byPlan.Morada}</div></div>
      <div class="kpi-card"><div class="kpi-label">Servicios usados</div>
        <div class="kpi-value">${state.consumos.length}</div></div>
      <div class="kpi-card"><div class="kpi-label">Vencimientos próx.</div>
        <div class="kpi-value" style="color:var(--warn)">${byStatus['Por vencer']}</div></div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Distribución por plan</h3>
        <div class="bar-chart">
          ${Object.entries(byPlan).map(([plan,n])=>{
            const p = PLANES[plan];
            const pct = Math.round((n/maxPlan)*100);
            return `<div class="bar-row">
              <div class="bar-label">${p.icon} ${plan}</div>
              <div class="bar-track">
                <div class="bar-fill ${p.color}" style="width:${pct}%">${n}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="chart-card">
        <h3>Servicios más usados</h3>
        <div class="bar-chart">
          ${Object.entries(allSvcs).map(([k,label])=>{
            const n = svcCount[k]||0;
            const pct = Math.round((n/maxSvc)*100);
            return `<div class="bar-row">
              <div class="bar-label" style="font-size:.75rem">${label}</div>
              <div class="bar-track">
                <div class="bar-fill morada" style="width:${pct||2}%">${n||''}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="chart-card">
      <h3>Estado de membresías</h3>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        ${[['Activa','✅',byStatus['Activa']||0,'success'],
           ['Por vencer','⚠️',byStatus['Por vencer']||0,'warn'],
           ['Vencida','❌',byStatus['Vencida']||0,'danger']].map(([label,icon,n,color])=>`
          <div style="text-align:center;min-width:100px">
            <div style="font-size:2rem">${icon}</div>
            <div style="font-family:'DM Serif Display',serif;font-size:2rem;color:var(--${color})">${n}</div>
            <div style="font-size:.78rem;color:var(--muted)">${label}</div>
          </div>`).join('')}
      </div>
    </div>
  `;
}

function filterUsuariosCliente(q){
  const rows = document.querySelectorAll('#usuarios-tbody tr');
  rows.forEach(r=>{
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

// PAGE: MI MEMBRESÍA (cliente)
// ════════════════════════════════════════════
function renderMiMembresia(c){
  const clienteId = state.session.clienteId;
  const cl = state.clientes.find(x=>x.id===clienteId);
  if(!cl){ c.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>No se encontró tu membresía.</p></div>'; return; }

  const plan = PLANES[cl.plan];
  const st   = statusCliente(cl);
  const usados = serviciosUsados(clienteId);
  const consumos = consumosPorCliente(clienteId).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const esMorada = plan.soloDescuentos;

  const svcsHTML = esMorada
    ? `<div style="background:var(--morada-lt);border:1px solid var(--lavender);border-radius:12px;
          padding:20px 24px;display:flex;align-items:center;gap:14px;margin-bottom:4px">
        <div style="font-size:2rem">💜</div>
        <div>
          <div style="font-weight:700;color:var(--plum);margin-bottom:4px">Plan Morada · Membresía de descuentos</div>
          <div style="font-size:.85rem;color:var(--muted)">Tu membresía incluye descuentos especiales en productos y servicios de Animal Center. Preséntala en cada visita para aplicar tu beneficio.</div>
        </div>
      </div>`
    : Object.entries(plan.servicios).map(([k,v])=>{
        const usado = usados[k]||0;
        const resto = Math.max(0, v.total-usado);
        const pct   = v.total ? Math.round((resto/v.total)*100) : 0;
        const depleted = resto===0 && v.total>0;
        const fillClass = pct<=25?'danger':pct<=60?'warn':'';
        return `<div class="svc-card ${depleted?'depleted':''}">
          <div class="svc-icon">${v.icon}</div>
          <div class="svc-title">${v.label}</div>
          <div class="svc-count">${resto}</div>
          <div class="svc-total">de ${v.total} restantes</div>
          <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
        </div>`;
      }).join('');

  c.innerHTML = `
    <div class="detail-header">
      <div class="detail-avatar">🐾</div>
      <div class="detail-info">
        <h2>${cl.nombre}</h2>
        <p>${cl.especie||'Mascota'}: <strong>${cl.mascota}</strong></p>
        <div class="detail-meta">
          ${pillPlan(cl.plan)}
          <span class="pill ${st.pill}"><span class="pill-dot"></span>${st.label} · ${
            st.days<0?'venció hace '+Math.abs(st.days)+' días':st.days+' días restantes'
          }</span>
        </div>
        <p style="font-size:.78rem;color:var(--muted);margin-top:6px">
          Membresía: ${formatDate(cl.fechaInicio)} → ${formatDate(cl.fechaFin)}
        </p>
      </div>
    </div>

    <div class="section-title">${esMorada ? 'Beneficios del plan' : 'Mis servicios'}</div>
    <div class="${esMorada ? '' : 'services-grid'}">${svcsHTML}</div>

    ${!esMorada ? `<div class="section-title">Historial</div>
    <div class="table-card">
      ${consumos.length?`
      <table>
        <thead><tr><th>Fecha</th><th>Servicio</th><th>Notas</th></tr></thead>
        <tbody>${consumos.map(co=>`<tr>
          <td style="font-size:.82rem">${formatDate(co.fecha)}</td>
          <td>${plan.servicios[co.servicio]?.icon||''} ${plan.servicios[co.servicio]?.label||co.servicio}</td>
          <td style="font-size:.82rem;color:var(--muted)">${co.notas||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>`:`<div class="empty-state" style="padding:32px"><div class="empty-icon">📋</div><p>Sin servicios registrados aún</p></div>`}
    </div>` : ''}
  `;
}
