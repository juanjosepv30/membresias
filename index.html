async function renderHistorial(c){
  c.innerHTML = `<div style="color:var(--muted);padding:20px">Cargando historial…</div>`;
  try {
    const r = await apiCall('getHistorial');
    state.historial = r.historial || [];
  } catch(e){
    c.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Error al cargar: ${e.message}</p></div>`;
    return;
  }

  const accionIcon = { addCliente:'➕', deleteCliente:'🗑', updateCliente:'✏️',
    addConsumo:'🩺', aprobarSolicitud:'✅', rechazarSolicitud:'❌',
    forgotPassword:'🔑', resetPassword:'🔑', changePassword:'🔑' };

  c.innerHTML = `
    <div class="table-card">
      <div class="table-header">
        <h2>🕐 Historial de acciones · ${state.historial.length}</h2>
        <input class="search-box" placeholder="🔍 Buscar…" oninput="filterHistorial(this.value)">
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Fecha</th><th>Hora</th><th>Acción</th><th>Usuario</th><th>Rol</th><th>Detalle</th></tr></thead>
          <tbody id="historial-tbody">
            ${state.historial.length
              ? state.historial.map(h=>{
                  const detalle = typeof h.detalle==='string' ? JSON.parse(h.detalle||'{}') : (h.detalle||{});
                  const icon = accionIcon[h.accion]||'📌';
                  const displayUser = detalle.usuario || (h.usuario||'').replace(/^(cli:|tp:)/,'') || '—';
                  const rol = h.rol || detalle.rol || '';
                  const rolPill = rol==='admin' ? 'pill-blue'
                    : (rol==='cliente'||rol==='cliente_terapia') ? 'pill-active'
                    : rol ? 'pill-expired' : 'pill-silver';
                  const displayDetail = formatDetalle(h.accion, detalle);
                  const hora = h.fecha ? new Date(h.fecha).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '—';
                  return `<tr>
                    <td style="font-size:.8rem;white-space:nowrap">${formatDate(h.fecha)}</td>
                    <td style="font-size:.8rem;white-space:nowrap;color:var(--muted)">${hora}</td>
                    <td><span style="display:flex;align-items:center;gap:6px;font-size:.85rem">${icon} ${h.accion}</span></td>
                    <td style="font-size:.82rem">${displayUser}</td>
                    <td><span class="pill ${rolPill}" style="font-size:.72rem">${rol||'—'}</span></td>
                    <td style="font-size:.78rem;color:var(--muted);max-width:220px">${displayDetail}</td>
                  </tr>`;
                }).join('')
              : `<tr><td colspan="6"><div class="empty-state" style="padding:40px"><div class="empty-icon">📂</div><p>Sin registros aún</p></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function filterHistorial(q){
  document.querySelectorAll('#historial-tbody tr').forEach(r=>{
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

function formatDetalle(accion, d){
  const svc = {
    consultas:'Consultas', consultaEsp:'Consulta especializada',
    parcialOrina:'Parcial de orina', ecografias:'Ecografía',
    rayosX:'Rayos X', laboratorio:'Exámenes de sangre', vacunas:'Vacuna'
  };
  const svcLabel = svc[d.servicio] || d.servicio || '—';
  switch(accion){
    case 'login':               return `Ingresó al sistema como ${d.rol||'—'}`;
    case 'addCliente':          return `${d.nombre||'—'} registrado · Plan ${d.plan||'—'}`;
    case 'addConsumo':          return `${d.clienteNombre||('ID:'+d.clienteId)||'—'} · ${svcLabel}${d.cantidad>1?' (x'+d.cantidad+')':''}`;
    case 'softDeleteCliente':   return `${d.nombre||('ID:'+d.clienteId)||'—'} desactivado`;
    case 'restoreCliente':      return `Cliente ID ${d.clienteId||'—'} restaurado`;
    case 'permanentDeleteCliente': return `${d.nombre||('ID:'+d.clienteId)||'—'} eliminado definitivamente`;
    case 'deleteConsumo':       return `Servicio eliminado: ${svcLabel}`;
    case 'updateCliente':       return `Campos editados: ${Array.isArray(d.campos)?d.campos.join(', '):(d.campos||'—')}`;
    case 'addSolicitud':        return `Solicitud de ${d.tipo||'—'} enviada`;
    case 'aprobarSolicitud':    return `Solicitud de ${d.tipo||'—'} aprobada`;
    case 'rechazarSolicitud':   return `Solicitud rechazada${d.motivo?' — '+d.motivo:''}`;
    case 'forgotPassword':      return `Recuperación de contraseña para ${d.email||'—'}`;
    case 'resetPassword':       return `Contraseña restablecida`;
    case 'changePassword':      return `${d.nombre||'—'} cambió su contraseña`;
    case 'addPacienteTerapia':  return `Paciente registrado: ${d.nombre||'—'}`;
    case 'addCombo':            return `Combo ${d.tipo||'—'} creado`;
    case 'addSesion':           return `Sesión de terapia registrada`;
    case 'deleteCombo':         return `Combo de terapia eliminado`;
    case 'deleteSesion':        return `Sesión de terapia eliminada`;
    default:                    return d.nombre||d.email||d.motivo||'—';
  }
}

async function reloadInyectoData(){
  showLoading('Cargando…');
  try {
    const ri = await apiCall('getAllInyecto');
    state.pacientesInyecto    = ri.pacientes    || [];
    state.combosInyecto       = ri.combos       || [];
    state.aplicacionesInyecto = ri.aplicaciones || [];
  } catch(e){ /* silent */ }
  finally { hideLoading(); }
}

function refreshInyectoView(){
  const pg = document.getElementById('page-content');
  if(!pg) return;
  if(clientesView === 'inyecto') renderClientes(pg);
}

async function switchToInyecto(c){
  clientesView = 'inyecto';
  renderClientes(c);
  await reloadInyectoData();
  if(clientesView === 'inyecto') renderClientes(c);
}

function renderInyecto(c, skipRefresh){
  const isAdmin    = state.session.rol === 'admin';
  const isPersonal = state.session.rol === 'personal';
  const n = state.pacientesInyecto.length;
  c.innerHTML = `
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div>
        <h2 style="font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--plum)">💉 Inyectología y Medicación</h2>
        <p style="color:var(--muted);font-size:.85rem;margin-top:2px">${n} paciente${n!==1?'s':''} registrado${n!==1?'s':''}</p>
      </div>
      ${(isAdmin||isPersonal) ? '<button class="btn-primary" style="width:auto;padding:10px 20px" onclick="openNuevoPacienteInyecto()">+ Nuevo paciente</button>' : ''}
    </div>
    ${n
      ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">${state.pacientesInyecto.map(p=>renderPacienteInyectoCard(p)).join('')}</div>`
      : '<div class="empty-state" style="padding:60px 20px"><div class="empty-icon">💉</div><p>Sin pacientes registrados</p></div>'}`;
  if(!skipRefresh){
    reloadInyectoData().then(() => renderInyecto(c, true));
  }
}

function renderPacienteInyectoCard(p){
  const isAdmin    = state.session.rol === 'admin';
  const isPersonal = state.session.rol === 'personal';
  const combosP      = state.combosInyecto.filter(c => String(c.pacienteId) === String(p.id));
  const activos      = combosP.filter(c => c.estado === 'activo');
  const completos    = combosP.filter(c => c.estado === 'completado');
  const primerActivo = activos[0];
  const todosCompletos = combosP.length > 0 && activos.length === 0;

  // Status / progress section
  let statusHtml = '';
  if(activos.length === 1){
    const u   = Number(primerActivo.dosisUsadas)||0;
    const t   = Number(primerActivo.dosisTotal)||1;
    const pct = Math.min(100, Math.round(u/t*100));
    const und = primerActivo.tipo === 'medicacion' ? 'dosis' : 'iny.';
    statusHtml = `
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u}/${t} ${und} · ${primerActivo.medicamento||''}</div>
      <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:10px">
        <div style="height:100%;width:${pct}%;background:var(--plum);border-radius:2px;transition:width .3s"></div>
      </div>`;
  } else if(activos.length > 1){
    statusHtml = `<div style="margin-bottom:10px"><span style="background:var(--success-lt);color:var(--success);font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:500">${activos.length} combos activos</span></div>`;
  } else if(todosCompletos){
    statusHtml = `<div style="margin-bottom:10px"><span style="background:var(--plum);color:#fff;font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:500">✓ Completado</span></div>`;
  } else {
    statusHtml = `<div style="margin-bottom:10px"><span style="background:var(--border);color:var(--muted);font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:500">Sin combo</span></div>`;
  }

  // Action button
  let actionBtn = '';
  if(activos.length === 1){
    actionBtn = `<button class="btn-primary" style="width:100%;font-size:.82rem;padding:8px 0"
      onclick="event.stopPropagation();openRegistrarAplicacion('${primerActivo.id}','${p.id}')">+ Aplicar</button>`;
  } else if(activos.length > 1){
    actionBtn = `<button class="btn-primary" style="width:100%;font-size:.82rem;padding:8px 0"
      onclick="event.stopPropagation();verPacienteInyecto('${p.id}')">Ver combos</button>`;
  } else if(todosCompletos){
    actionBtn = `<button onclick="event.stopPropagation();descartarPacienteInyecto('${p.id}')"
      style="width:100%;font-size:.82rem;padding:8px 0;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif">Archivar</button>`;
  } else if(isAdmin || isPersonal){
    actionBtn = `<button class="btn-primary" style="width:100%;font-size:.82rem;padding:8px 0"
      onclick="event.stopPropagation();openNuevoComboInyecto('${p.id}')">+ Combo</button>`;
  }

  // Admin delete button (top-right corner)
  const deleteBtn = isAdmin
    ? `<button title="Eliminar paciente" onclick="event.stopPropagation();eliminarPacienteInyecto('${p.id}')"
        style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:2px 4px;line-height:1;flex-shrink:0;border-radius:4px">✕</button>`
    : '';

  return `<div onclick="verPacienteInyecto('${p.id}')"
    style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s;box-shadow:var(--shadow-sm)">
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0">
        ${(p.nombre||'?')[0].toUpperCase()}
      </div>
      <div style="min-width:0;flex:1">
        <div style="font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.nombre}</div>
        <div style="font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.mascota||'—'} · ${p.especie||'—'}${p.tel?' · '+p.tel:''}</div>
      </div>
      ${deleteBtn}
    </div>
    ${statusHtml}
    ${actionBtn}
  </div>`;
}

function verPacienteInyecto(pacienteId){
  const isAdmin = state.session.rol === 'admin';
  const isPersonal = state.session.rol === 'personal';
  const p = state.pacientesInyecto.find(x => String(x.id) === String(pacienteId));
  if(!p) return;
  const combosP      = state.combosInyecto.filter(c => String(c.pacienteId) === String(pacienteId));
  const activos      = combosP.filter(c => c.estado === 'activo');
  const completos    = combosP.filter(c => c.estado === 'completado');
  const todosCompletos = combosP.length > 0 && activos.length === 0;

  const tipoLabel = t => t === 'medicacion' ? 'Medicación' : 'Inyectología';
  const tipoPill  = t => t === 'medicacion'
    ? 'background:#EDE9FE;color:#5B21B6'
    : 'background:#DBEAFE;color:#1D4ED8';

  const renderComboInyecto = (combo, isActivo) => {
    const apps        = state.aplicacionesInyecto.filter(a => String(a.comboId) === String(combo.id));
    const dosisUsadas = Number(combo.dosisUsadas) || 0;
    const dosisTotal  = Number(combo.dosisTotal)  || 1;
    const pct         = Math.min(100, Math.round(dosisUsadas / dosisTotal * 100));
    const unidades    = combo.tipo === 'medicacion' ? 'dosis' : 'inyecciones';
    return `<div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div>
          <span style="font-size:.72rem;padding:2px 8px;border-radius:10px;${tipoPill(combo.tipo)};margin-right:6px">${tipoLabel(combo.tipo||'inyectologia')}</span>
          <strong style="color:var(--plum)">${combo.medicamento||'—'}</strong>
          ${combo.notas ? `<div style="color:var(--muted);font-size:.8rem;margin-top:4px">${combo.notas}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px">
          <span class="pill ${isActivo?'pill-active':'pill-silver'}" style="font-size:.72rem">${isActivo?'Activo':'Completado'}</span>
          ${isActivo ? `<button class="btn-primary" style="font-size:.78rem;padding:5px 10px"
            onclick="openRegistrarAplicacion('${combo.id}','${pacienteId}')">+ Aplicar</button>` : ''}
        </div>
      </div>
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:8px">
        ${dosisUsadas} / ${dosisTotal} ${unidades} · $${Number(combo.precio||0).toLocaleString('es-CO')} · Desde ${formatDate(combo.fecha)}
      </div>
      <div style="background:var(--cream);border-radius:6px;height:8px;overflow:hidden;margin-bottom:10px">
        <div style="background:${pct>=100?'var(--success)':'var(--plum)'};height:100%;width:${pct}%;transition:width .3s"></div>
      </div>
      ${apps.length
        ? `<div style="font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Aplicaciones</div>
           ${apps.slice().reverse().map(a => `
             <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding:5px 0;font-size:.8rem">
               <span>${formatDate(a.fecha)}${a.notas?' — '+a.notas:''}</span>
               <span style="color:var(--muted)">${(a.registradoPor||'').replace(/^(cli:|tp:)/,'')}</span>
             </div>`).join('')}`
        : `<div style="font-size:.8rem;color:var(--muted)">Sin aplicaciones aún</div>`}
    </div>`;
  };

  openModal(`${p.nombre} · ${p.mascota||'—'}`, `
    <p style="margin:0 0 16px;color:var(--muted);font-size:.85rem">${p.especie||'—'}${p.tel?' · '+p.tel:''}</p>
    ${activos.length ? `<div style="font-size:.75rem;font-weight:600;color:var(--plum);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Activos</div>${activos.map(c=>renderComboInyecto(c,true)).join('')}` : ''}
    ${completos.length ? `<div style="font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 8px">Completados</div>${completos.map(c=>renderComboInyecto(c,false)).join('')}` : ''}
    ${!combosP.length ? '<div class="empty-state" style="padding:20px"><div class="empty-icon">💉</div><p>Sin combos</p></div>' : ''}
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal();refreshInyectoView()">Cerrar</button>
      ${todosCompletos ? `<button class="btn-cancel" onclick="closeModal();descartarPacienteInyecto('${pacienteId}')">Archivar</button>` : ''}
      ${(isAdmin || isPersonal) ? `<button class="btn-save" onclick="closeModal();openNuevoComboInyecto('${pacienteId}')">+ Nuevo combo</button>` : ''}
      ${isAdmin ? `<button onclick="closeModal();eliminarPacienteInyecto('${pacienteId}')"
        style="padding:10px 20px;border-radius:var(--radius-sm);border:1px solid #EF4444;background:transparent;color:#EF4444;font-family:'DM Sans',sans-serif;font-size:.875rem;font-weight:600;cursor:pointer">Eliminar paciente</button>` : ''}
    </div>`);
}

async function guardarPacienteInyecto(){

  const dosisTotal  = parseInt(document.getElementById('iny-dosis').value)||0;
  if(!nombre||!mascota)  return toast('Nombre y mascota son obligatorios','error');
  if(!medicamento)        return toast('El medicamento es obligatorio','error');
  if(dosisTotal < 1)      return toast('Ingresá al menos 1 unidad','error');
  showLoading();
  try {
    const rp = await apiCall('addPacienteInyecto',{
      nombre, mascota,
      cedula:  document.getElementById('iny-cedula').value.trim(),
      especie: document.getElementById('iny-especie').value,
      tel:     document.getElementById('iny-tel').value.trim(),
      email:   document.getElementById('iny-email').value.trim(),
    });

      tipo:        document.getElementById('iny-tipo').value,

    });
    state.combosInyecto.push(rc.combo);
    closeModal(); hideLoading();
    toast('Paciente y combo registrados');
    refreshInyectoView();
    verPacienteInyecto(rp.paciente.id);
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

async function guardarAplicacion(comboId, pacienteId){
  showLoading();
  try {
    const r = await apiCall('addAplicacion',{
      comboId, pacienteId,
      fecha: document.getElementById('iny-ap-fecha').value,
      notas: document.getElementById('iny-ap-notas').value.trim(),
    });
    state.aplicacionesInyecto.push(r.aplicacion);
    const combo = state.combosInyecto.find(c => String(c.id) === String(comboId));
    if(combo){
      combo.dosisUsadas = Number(combo.dosisUsadas||0) + 1;
      if(Number(combo.dosisUsadas) >= Number(combo.dosisTotal)) combo.estado = 'completado';
    }
    // Auto-archive if ALL combos for this patient are now completed
    const combosDelPaciente = state.combosInyecto.filter(c => String(c.pacienteId) === String(pacienteId));
    const todosTerminados = combosDelPaciente.length > 0 && combosDelPaciente.every(c => c.estado === 'completado');
    if(todosTerminados){
      try { await apiCall('archivePacienteInyecto', { pacienteId }); } catch(_){}
      state.pacientesInyecto = state.pacientesInyecto.filter(p => String(p.id) !== String(pacienteId));
      closeModal(); hideLoading();
      toast('¡Tratamiento completado! Movido a Descartados.');
      refreshInyectoView();
      return;
    }
    closeModal(); hideLoading();
    toast('Aplicación registrada');
    refreshInyectoView();
    verPacienteInyecto(pacienteId);
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

async function descartarPacienteInyecto(pacienteId){
  if(!confirm('¿Archivar este paciente? Ya no aparecerá en la lista activa.')) return;
  showLoading();
  try {
    await apiCall('archivePacienteInyecto', { pacienteId });
    state.pacientesInyecto = state.pacientesInyecto.filter(p => String(p.id) !== String(pacienteId));
    hideLoading();
    toast('Paciente archivado');
    refreshInyectoView();
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

async function eliminarPacienteInyecto(pacienteId){
  const p = state.pacientesInyecto.find(x => String(x.id) === String(pacienteId));
  if(!confirm(`¿Eliminar permanentemente a "${p?.nombre||'este paciente'}" y todos sus datos? Esta acción no se puede deshacer.`)) return;
  showLoading();
  try {
    await apiCall('deletePacienteInyecto', { pacienteId });
    state.pacientesInyecto    = state.pacientesInyecto.filter(x => String(x.id) !== String(pacienteId));
    state.combosInyecto       = state.combosInyecto.filter(c => String(c.pacienteId) !== String(pacienteId));
    state.aplicacionesInyecto = state.aplicacionesInyecto.filter(a => String(a.pacienteId) !== String(pacienteId));
    hideLoading();
    toast('Paciente eliminado');
    closeModal();
    refreshInyectoView();
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

async function doForgotPassword(){
  const email = document.getElementById('fp-email').value.trim();
  const msg   = document.getElementById('fp-msg');
  if(!email){ msg.style.color='var(--danger)'; msg.textContent='Ingresá tu correo.'; return; }
  msg.style.color='var(--muted)'; msg.textContent='Enviando…';
  try {
    await apiCall('forgotPassword', { email });
    msg.style.color='var(--success)';
    msg.textContent='✅ Te enviamos el enlace a ese correo. Revisá tu bandeja.';
    document.querySelector('#modal-body .btn-save').disabled = true;
  } catch(e){
    msg.style.color='var(--danger)';
    msg.textContent = e.message === 'correo_no_encontrado'
      ? '❌ El correo electrónico no está registrado.'
      : 'Error: ' + e.message;
  }
}

function renderTerapias(c){

    </div>`;
}

function renderPacienteCard(p){
  const combos       = state.combos.filter(c => c.pacienteId === p.id);
  const activos      = combos.filter(c => c.estado === 'activo');
  const comboActivo  = activos[0];
  const todosCompletos = combos.length > 0 && activos.length === 0;

  // Status / progress section
  let statusHtml = '';
  if(comboActivo){
    const def    = COMBOS_TERAPIA[comboActivo.tipo] || {};
    const usadas = state.sesionesTerapia.filter(s => s.comboId === comboActivo.id).length;
    const total  = comboActivo.sesionesTotal || def.sesiones || 0;
    const pct    = total > 0 ? Math.min(100, Math.round(usadas/total*100)) : 0;
    statusHtml = `
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${usadas}/${total} sesiones · ${def.icon||''} ${def.label||comboActivo.tipo}</div>
      <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:10px">
        <div style="height:100%;width:${pct}%;background:var(--plum);border-radius:2px;transition:width .3s"></div>
      </div>`;
  } else if(todosCompletos){
    statusHtml = `<div style="margin-bottom:10px"><span style="background:var(--plum);color:#fff;font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:500">✓ Completado</span></div>`;
  } else {
    statusHtml = `<div style="margin-bottom:10px"><span style="background:var(--border);color:var(--muted);font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:500">Sin combo activo</span></div>`;
  }

  // Action button
  let actionBtn;
  if(comboActivo){
    actionBtn = `<button class="btn-primary" style="width:100%;font-size:.82rem;padding:8px 0"
        onclick="event.stopPropagation();openRegistrarSesion('${comboActivo.id}')">+ Sesión</button>`;
  } else if(todosCompletos){
    actionBtn = `<button onclick="event.stopPropagation();archivarTerapia('${p.id}')"
        style="width:100%;font-size:.82rem;padding:8px 0;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif">Archivar</button>`;
  } else {
    actionBtn = `<button class="btn-primary" style="width:100%;font-size:.82rem;padding:8px 0"
        onclick="event.stopPropagation();openNuevoCombo('${p.id}')">+ Combo</button>`;
  }

  return `<div onclick="verPacienteTerapia('${p.id}')"
    style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s;box-shadow:var(--shadow-sm)">
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0">
        ${(p.nombre||'?')[0].toUpperCase()}
      </div>
      <div style="min-width:0;flex:1">
        <div style="font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.nombre}</div>
        <div style="font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.mascota||'—'} · ${p.especie||'—'}${p.telefono?' · '+p.telefono:''}</div>
      </div>
    </div>
    ${statusHtml}
    ${actionBtn}
  </div>`;
}

function verPacienteTerapia(pacienteId){
  const p = state.pacientesTerapia.find(x => x.id === pacienteId);
  if(!p) return;
  const puedeEliminar = state.session.rol === 'admin' || state.session.rol === 'terapista';
  const combos = state.combos.filter(c => c.pacienteId === pacienteId);

  const combosHtml = combos.length === 0
    ? '<p style="color:var(--muted);text-align:center;padding:20px">Sin combos registrados</p>'
    : combos.map(combo => {
        const def = COMBOS_TERAPIA[combo.tipo] || {};
        const sesiones = state.sesionesTerapia.filter(s => s.comboId === combo.id);
        const usadas = sesiones.length;
        const total = combo.sesionesTotal || def.sesiones || 0;
        const pct = total > 0 ? Math.round(usadas/total*100) : 0;
        const activo = combo.estado === 'activo';
        return `
          <div style="background:var(--cream);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <div>
                <span style="font-size:1.1rem">${def.icon||'🐾'}</span>
                <strong style="margin-left:6px">${def.label||combo.tipo}</strong>
                <span style="margin-left:8px;font-size:.7rem;padding:2px 8px;border-radius:12px;background:${activo?'var(--success-lt)':'var(--border)'};color:${activo?'var(--success)':'var(--muted)'}">${activo?'Activo':'Completado'}</span>
              </div>
              <div style="display:flex;gap:6px">
                ${activo ? `<button class="btn-icon" onclick="openRegistrarSesion('${combo.id}')">＋ Sesión</button>` : ''}
                ${puedeEliminar ? `<button class="btn-icon" onclick="eliminarCombo('${combo.id}','${pacienteId}')" title="Eliminar combo">🗑</button>` : ''}
              </div>
            </div>
            <div style="background:var(--border);border-radius:4px;height:6px;margin-bottom:6px">
              <div style="background:var(--plum-mid);height:6px;border-radius:4px;width:${pct}%"></div>
            </div>
            <div style="font-size:.78rem;color:var(--muted);margin-bottom:${sesiones.length?'10px':'0'}">${usadas} de ${total} sesiones · ${fmtCOP(combo.precio||0)}</div>
            ${sesiones.length > 0 ? `
              <div style="font-size:.8rem">
                ${sesiones.slice().reverse().map(s=>`
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
                    <span style="color:var(--muted);flex-shrink:0">${s.fecha||''}</span>
                    <span style="flex:1;margin:0 10px;color:var(--ink)">${s.nota||''}</span>
                    ${puedeEliminar ? `<button class="btn-icon danger" onclick="eliminarSesion('${s.id}','${combo.id}','${pacienteId}')" title="Eliminar sesión" style="padding:2px 6px;font-size:.75rem">🗑</button>` : ''}
                  </div>`).join('')}
              </div>` : ''}
          </div>`;
      }).join('');

  openModal(p.nombre, `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;font-size:.85rem">
      <div><span style="color:var(--muted)">Mascota:</span> ${p.mascota||'—'}</div>
      <div><span style="color:var(--muted)">Especie:</span> ${p.especie||'—'}</div>
      <div><span style="color:var(--muted)">Teléfono:</span> ${p.telefono||'—'}</div>
      <div><span style="color:var(--muted)">Email:</span> ${p.email||'—'}</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <strong style="font-size:.9rem">Combos</strong>
      <button class="btn-icon" onclick="openNuevoCombo('${p.id}')">+ Combo</button>
    </div>
    ${combosHtml}
  `);
}

function openNuevoPacienteTerapia(){
  openModal('Nuevo Paciente · Terapias', `
    <div class="form-row">
      <div class="form-group">
        <label>Nombre completo *</label>
        <input type="text" id="tp-nombre" placeholder="Ej: María García">
      </div>
      <div class="form-group">
        <label>Cédula</label>
        <input type="text" id="tp-cedula" placeholder="Número de cédula">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Nombre de mascota *</label>
        <input type="text" id="tp-mascota" placeholder="Ej: Milo">
      </div>
      <div class="form-group">
        <label>Especie</label>
        <select id="tp-especie">
          <option value="Perro">🐕 Perro</option>
          <option value="Gato">🐈 Gato</option>
          <option value="Otro">🐾 Otro</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="tp-tel" placeholder="3XX XXX XXXX">
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="tp-email" placeholder="cliente@correo.com">
        <div class="form-hint">Opcional — para acceso al portal de terapias</div>
      </div>
    </div>
    <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:16px">
      <div style="font-weight:600;font-size:.9rem;margin-bottom:12px">Combo inicial (opcional)</div>
      <div class="form-row">
        <div class="form-group">
          <label>Tipo de combo</label>
          <select id="tp-combo-tipo">
            <option value="">— Sin combo por ahora —</option>
            ${Object.entries(COMBOS_TERAPIA).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label} — ${fmtCOP(v.precio)}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Fecha de inicio</label>
          <input type="date" id="tp-combo-fecha" value="${new Date().toISOString().slice(0,10)}">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarPacienteTerapia()">Guardar paciente</button>
    </div>
  `);
}

async function guardarPacienteTerapia(){
  const nombre  = document.getElementById('tp-nombre').value.trim();
  const cedula  = document.getElementById('tp-cedula').value.trim();
  const mascota = document.getElementById('tp-mascota').value.trim();
  const especie = document.getElementById('tp-especie').value;
  const telefono= document.getElementById('tp-tel').value.trim();
  const email   = document.getElementById('tp-email').value.trim();
  const comboTipo  = document.getElementById('tp-combo-tipo').value;
  const comboFecha = document.getElementById('tp-combo-fecha').value;
  if(!nombre || !mascota){ toast('Nombre y mascota son obligatorios','error'); return; }
  showLoading();
  try {
    const r = await apiCall('addPacienteTerapia', { nombre, cedula, mascota, especie, telefono, email });
    state.pacientesTerapia.push(r.paciente);
    if(comboTipo){
      const def = COMBOS_TERAPIA[comboTipo];
      const rc = await apiCall('addCombo', { pacienteId: r.paciente.id, tipo: comboTipo, fecha: comboFecha, totalSesiones: def.sesiones, precio: def.precio });
      state.combos.push(rc.combo);
    }
    closeModal();
    hideLoading();
    toast('✅ Paciente registrado' + (comboTipo ? ' con combo' : ''));
    if(state.session.rol === 'terapista'){ renderPage('terapias'); }
    else { clientesView = 'terapias'; renderPage('clientes'); }
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

function openNuevoCombo(pacienteId){
  const opts = Object.entries(COMBOS_TERAPIA).map(([k,v])=>
    `<option value="${k}">${v.icon} ${v.label} — ${v.sesiones} sesiones — ${fmtCOP(v.precio)}</option>`
  ).join('');
  openModal('Nuevo Combo', `
    <div class="form-group"><label>Tipo de combo *</label>
      <select id="nc-tipo" class="form-input">${opts}</select>
    </div>
    <div class="form-group"><label>Fecha de inicio</label><input id="nc-fecha" class="form-input" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="form-group"><label>Observación</label><input id="nc-obs" class="form-input" placeholder="Diagnóstico, motivo…"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarCombo('${pacienteId}')">Guardar</button>
    </div>
  `);
}

async function guardarCombo(pacienteId){
  const tipo  = document.getElementById('nc-tipo').value;
  const fecha = document.getElementById('nc-fecha').value;
  const obs   = document.getElementById('nc-obs').value.trim();
  const def   = COMBOS_TERAPIA[tipo];
  showLoading();
  try {
    const r = await apiCall('addCombo', { pacienteId, tipo, fecha, observacion:obs, totalSesiones:def.sesiones, precio:def.precio });
    state.combos.push(r.combo);
    closeModal();
    hideLoading();
    toast('✅ Combo registrado');
    refreshTerapiaView();
    verPacienteTerapia(pacienteId);
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

function openRegistrarSesion(comboId){
  const combo = state.combos.find(c => c.id === comboId);
  if(!combo) return;
  const def = COMBOS_TERAPIA[combo.tipo] || {};
  openModal('Registrar Sesión', `
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:16px">${def.icon||''} ${def.label||combo.tipo}</p>
    <div class="form-group"><label>Fecha *</label><input id="rs-fecha" class="form-input" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="form-group"><label>Nota clínica</label><input id="rs-nota" class="form-input" placeholder="Observaciones de la sesión…"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarSesion('${comboId}')">Guardar</button>
    </div>
  `);
}

async function guardarSesion(comboId){
  const fecha = document.getElementById('rs-fecha').value;
  const nota  = document.getElementById('rs-nota').value.trim();
  if(!fecha){ toast('La fecha es obligatoria','error'); return; }
  showLoading();
  try {
    const r = await apiCall('addSesion', { comboId, fecha, nota });
    state.sesionesTerapia.push(r.sesion);
    // Auto-cerrar combo si ya alcanzó el total
    const combo = state.combos.find(c => c.id === comboId);
    const usadas = state.sesionesTerapia.filter(s => s.comboId === comboId).length;
    if(combo && usadas >= (combo.sesionesTotal || 10)) combo.estado = 'completado';
    // Detect if ALL combos for this patient are now completed → archive to Descartados
    const combosPaciente = state.combos.filter(c => c.pacienteId === combo?.pacienteId);
    const todosTerapiaCompletos = combosPaciente.length > 0 && combosPaciente.every(c => c.estado === 'completado');
    if(todosTerapiaCompletos){
      try { await apiCall('archivePacienteTerapia', { pacienteId: combo.pacienteId }); } catch(_){}
      state.pacientesTerapia = state.pacientesTerapia.filter(p => p.id !== combo.pacienteId);
      closeModal(); hideLoading();
      toast('¡Tratamiento completado! Movido a Descartados.');
      const pg = document.getElementById('page-content');
      if(state.session.rol === 'terapista') renderTerapias(pg);
      else { clientesView = 'terapias'; renderClientes(pg); }
      return;
    }
    closeModal(); hideLoading();
    toast('✅ Sesión registrada');
    refreshTerapiaView();
    verPacienteTerapia(combo.pacienteId);
  } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
}

async function eliminarCombo(comboId, pacienteId){
  openConfirm('¿Eliminar este combo? También se eliminarán todas sus sesiones.', async () => {
    showLoading();
  try {
    await apiCall('deleteCombo', { comboId });
    state.combos = state.combos.filter(c => c.id !== comboId);
    state.sesionesTerapia = state.sesionesTerapia.filter(s => s.comboId !== comboId);
    hideLoading();
    toast('Combo eliminado');
    refreshTerapiaView();
    verPacienteTerapia(pacienteId);
    } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
  });
}

async function eliminarSesion(sesionId, comboId, pacienteId){
  openConfirm('¿Eliminar esta sesión?', async () => {
    showLoading();
    try {
      await apiCall('deleteSesion', { sesionId, comboId });
      state.sesionesTerapia = state.sesionesTerapia.filter(s => s.id !== sesionId);
      hideLoading();
      toast('Sesión eliminada');
      refreshTerapiaView();
      verPacienteTerapia(pacienteId);
    } catch(e){ hideLoading(); toast('Error: '+e.message,'error'); }
  });
}

// ════════════════════════════════════════════
// TERAPIAS — cliente_terapia view
// ════════════════════════════════════════════
function renderMisTerapias(c){
  const p = state.pacientesTerapia[0];
  if(!p){ c.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)">Sin datos de terapias.</div>'; return; }
  const combos = state.combos.filter(cb => cb.pacienteId === p.id);
  c.innerHTML = `
    <div style="max-width:600px;margin:0 auto;padding:20px">
      <h2 style="font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--plum);margin-bottom:4px">${p.mascota}</h2>
      <p style="color:var(--muted);font-size:.85rem;margin-bottom:20px">Propietario: ${p.nombre}</p>
      ${combos.length === 0
        ? '<p style="text-align:center;color:var(--muted)">No tenés combos registrados aún.</p>'
        : combos.map(combo => {
            const def = COMBOS_TERAPIA[combo.tipo] || {};
            const sesiones = state.sesionesTerapia.filter(s => s.comboId === combo.id);
            const usadas = sesiones.length;
            const total = combo.sesionesTotal || def.sesiones || 0;
            const pct = total > 0 ? Math.round(usadas/total*100) : 0;
            const activo = combo.estado === 'activo';
            return `
              <div class="card" style="margin-bottom:16px">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
                  <span style="font-size:1.4rem">${def.icon||'🐾'}</span>
                  <div>
                    <div style="font-weight:600">${def.label||combo.tipo}</div>
                    <div style="font-size:.78rem;color:var(--muted)">Inicio: ${combo.fecha||'—'}</div>
                  </div>
                  <span class="badge" style="margin-left:auto;background:${activo?'var(--success-lt)':'var(--border)'};color:${activo?'var(--success)':'var(--muted)'};padding:3px 10px;border-radius:20px;font-size:.75rem">${activo?'Activo':'Completado'}</span>
                </div>
                <div style="background:var(--border);border-radius:4px;height:8px;margin-bottom:8px">
                  <div style="background:var(--plum-mid);height:8px;border-radius:4px;width:${pct}%"></div>
                </div>
                <div style="font-size:.82rem;color:var(--muted);margin-bottom:${sesiones.length?'12px':'0'}">${usadas} de ${total} sesiones completadas</div>
                ${sesiones.length > 0 ? `
                  <div style="font-size:.8rem">
                    ${sesiones.slice().reverse().map(s=>`
                      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
                        <span>📅 ${s.fecha||''}</span>
                        <span style="color:var(--muted)">${s.nota||''}</span>
                      </div>`).join('')}
                  </div>` : ''}
              </div>`;
          }).join('')}
    </div>`;
}
</script>
